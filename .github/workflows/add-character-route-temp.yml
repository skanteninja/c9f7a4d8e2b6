name: Add avatar media route temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-character-route-temp.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add avatar media rewrite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.cjs')
          s=p.read_text()
          old="    .replaceAll('https://api.dreamms.gg/api/GMS/latest/pet/', '/game-media/pets/')\n"
          new=old+"    .replaceAll('https://api.dreamms.gg/api/GMS/latest/character/', '/game-media/characters/')\n"
          assert old in s, 'owned URL insertion target missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/add-character-route-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.cjs
          git commit -m 'Route avatar renders through owned media path'
          git push
