name: Audit quests and maps temp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current ETC totals against I/L quest catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/ohmi69/osms_datamine_dashboard/contents/data/current/quests.json?ref=main' -o /tmp/quests.json
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');const root=process.cwd();
          function chunk(name){const d=`${root}/public/repairs/${name}`;if(fs.existsSync(d))return fs.readFileSync(d,'utf8');const stem=name.replace(/\.txt$/,'');let r='';for(let i=0;;i++){const p=`${root}/public/repairs/${stem}.part${i}.txt`;if(!fs.existsSync(p))break;r+=fs.readFileSync(p,'utf8')}return r||fs.readFileSync(`${root}/public/assets/runtime/${name}`,'utf8')}
          let b='';for(let i=0;i<6;i++)b+=chunk(`guide.${String(i).padStart(2,'0')}.txt`).replace(/\s+/g,'');const g=JSON.parse(zlib.gunzipSync(Buffer.from(b,'base64')).toString('utf8'));
          const current=JSON.parse(fs.readFileSync('/tmp/quests.json','utf8')).quests||[];
          console.log('GUIDE QUEST SAMPLE');for(const x of (g.quests||[]).slice(0,8))console.log(JSON.stringify(x));
          console.log('GUIDE QUEST KEYS',Object.keys((g.quests||[])[0]||{}));
          const names=new Set((g.quests||[]).filter(x=>x['I/L Relevant']!==false&&String(x['I/L Relevant']||'').toLowerCase()!=='no').flatMap(x=>[String(x.Quest||''),String(x['Quest Name']||''),String(x.Name||'')]).filter(Boolean));
          console.log('GUIDE QUESTS',g.quests?.length,'ELIGIBLE NAMES',names.size);
          const inGuide=q=>names.has(q.name)||names.has(q.parent);
          const all=new Map();
          for(const q of current){if(!inGuide(q)||q.is_weekly||(+q.level_min||0)>70)continue;for(const r of q.requirements_list||[]){if(r.type!=='item'||!r.name||!+r.count)continue;const a=all.get(r.name)||[];a.push({quest:q.name,count:+r.count,level:+q.level_min||0,region:q.region||''});all.set(r.name,a)}}
          console.log('ITEM|ONE-TIME-IN-GUIDE|KEEP15|START|USES');
          [...all.entries()].map(([name,rows])=>({name,rows,total:rows.reduce((s,x)=>s+x.count,0),start:Math.min(...rows.map(x=>x.level))})).filter(x=>x.total>=1).sort((a,b)=>b.total-a.total).forEach(x=>console.log([x.name,x.total,x.total===1?1:Math.ceil(x.total*1.15),x.start,x.rows.map(r=>`${r.quest} x${r.count}`).join('; ')].join('|')));
          NODE
