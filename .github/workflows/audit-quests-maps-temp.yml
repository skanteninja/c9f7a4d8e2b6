name: Audit quests and maps temp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print ETC planner source fields
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');const root=process.cwd();
          function chunk(name){const d=`${root}/public/repairs/${name}`;if(fs.existsSync(d))return fs.readFileSync(d,'utf8');const stem=name.replace(/\.txt$/,'');let r='';for(let i=0;;i++){const p=`${root}/public/repairs/${stem}.part${i}.txt`;if(!fs.existsSync(p))break;r+=fs.readFileSync(p,'utf8')}return r||fs.readFileSync(`${root}/public/assets/runtime/${name}`,'utf8')}
          let b='';for(let i=0;i<6;i++)b+=chunk(`guide.${String(i).padStart(2,'0')}.txt`).replace(/\s+/g,'');const g=JSON.parse(zlib.gunzipSync(Buffer.from(b,'base64')).toString('utf8'));
          for(const x of g.etc||[])console.log(JSON.stringify(x));
          NODE
