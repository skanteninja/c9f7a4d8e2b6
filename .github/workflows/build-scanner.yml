name: Build Windows SHOPPER scanner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scanner/**','audit/export-scanner-catalog.py','.github/workflows/build-scanner.yml']
permissions:
  contents: write
jobs:
  scanner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scanner/requirements.txt pyinstaller
      - run: python audit/export-scanner-catalog.py
      - run: python -m unittest discover -s scanner -p 'test_*.py'
      - name: Install portable Tesseract for the release
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $ocr = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (!(Test-Path (Join-Path $ocr 'tesseract.exe'))) { throw "Tesseract was not installed at $ocr" }
          New-Item -ItemType Directory -Force scanner/tesseract | Out-Null
          Copy-Item "$ocr/*" scanner/tesseract -Recurse -Force
          if (!(Test-Path scanner/tesseract/tessdata/eng.traineddata)) { throw 'English Tesseract data is missing' }
      - working-directory: scanner
        run: pyinstaller --onedir --windowed --name TCW-Shopper --add-data "items.json;." --add-data "connection.json;." --add-data "tesseract;tesseract" --hidden-import cv2 app.py
      - name: Check capture imports inside packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath scanner/dist/TCW-Shopper/TCW-Shopper.exe -ArgumentList '--capture-self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged capture dependency check failed: $($process.ExitCode)" }
      - shell: pwsh
        run: Copy-Item scanner/README.md scanner/dist/TCW-Shopper/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: TCW-Shopper-Windows
          path: scanner/dist/TCW-Shopper
          retention-days: 30

      - name: Publish versioned and latest scanner downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path scanner/dist/TCW-Shopper/* -DestinationPath TCW-Shopper-Windows.zip
          $tag = "scanner-$env:GITHUB_SHA"
          gh release create $tag TCW-Shopper-Windows.zip --title "SHOPPER Windows $($env:GITHUB_SHA.Substring(0,7))" --notes "Windows scanner built from commit $env:GITHUB_SHA. Extract the whole ZIP. Tesseract OCR and the website connection are included. Choose a public nickname and review scans before publishing."
          if ($LASTEXITCODE -ne 0) { throw 'Versioned scanner release failed' }
          gh release view scanner-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create scanner-latest --title "Latest SHOPPER Windows scanner" --notes "Automatically updated after scanner changes. Website upload connection is included."
          }
          gh release upload scanner-latest TCW-Shopper-Windows.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Latest scanner upload failed' }
          gh release edit scanner-latest --title "Latest SHOPPER Windows scanner" --notes "Latest successful Windows package: $env:GITHUB_SHA. Extract the ZIP; Tesseract OCR and the website upload connection are included. Choose a nickname and confirm OCR and shop/location before publishing."
