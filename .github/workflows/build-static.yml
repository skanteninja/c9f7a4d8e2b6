name: Build static site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'build.cjs'
      - '.github/workflows/build-static.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct verified static files
        run: |
          node build.cjs
          rm -rf site
          mv dist site

      - name: Verify static output
        run: |
          for f in app guide-data visuals visuals-db visuals-npc visuals-skills visuals-portals dashboard-polish progression-sync progression-level-hook progression-skill-state progression-gear-visual; do
            node --check "site/$f.js"
            test -s "site/$f.js"
          done
          for f in styles visuals visuals-db visuals-npc visuals-skills visuals-portals dashboard-polish progression-sync progression-gear-visual; do
            test -s "site/$f.css"
          done
          for asset in styles.css visuals.css visuals-db.css visuals-npc.css visuals-skills.css visuals-portals.css dashboard-polish.css progression-sync.css progression-gear-visual.css guide-data.js app.js visuals.js visuals-db.js visuals-npc.js visuals-skills.js visuals-portals.js dashboard-polish.js progression-sync.js progression-level-hook.js progression-skill-state.js progression-gear-visual.js; do
            grep -q "$asset?v=0.8.1-static1" site/index.html
          done
          grep -q 'MapleStory Classic Builder 0.8.1-static1' site/build-info.txt

      - name: Browser boot dashboard and progression regression gate
        run: |
          cat > site/ci-progression-test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><iframe id="app" src="/"></iframe><div id="ci-result">pending</div><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          const result=document.getElementById('ci-result');
          const frame=document.getElementById('app');
          frame.addEventListener('load',async()=>{
            try{
              const d=frame.contentDocument;
              for(let i=0;i<40&&!d.documentElement.classList.contains('progression-sync-ready');i++)await delay(150);
              const required=['progression-sync-ready','beginner-skill-tree-ready','progression-level-hook-ready','progression-skill-state-ready','progression-gear-visual-ready','progression-compact-dashboard-ready','progression-gear-decision-verified'];
              for(const cls of required){if(!d.documentElement.classList.contains(cls))throw Error('missing '+cls);}
              if(d.querySelectorAll('#atlas-skill-grid .beginner-skill-card').length!==3)throw Error('beginner skill count');
              if(d.querySelector('.progression-loadout-strip'))throw Error('duplicate level-synced equipment strip present');
              if(d.querySelector('.v5-avatar .avatar-equipped-icons'))throw Error('duplicate avatar equipment chips present');
              if(!d.querySelector('#atlas-avatar .avatar-character'))throw Error('character render missing');

              const change=async(level,needles,newWeapon)=>{
                const sel=d.getElementById('level-select');
                sel.value=String(level);
                sel.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
                await delay(1050);
                if(d.documentElement.dataset.autoGearLevel!==String(level))throw Error('auto gear marker '+level);
                if(d.documentElement.dataset.skillStateLevel!==String(level))throw Error('skill state marker '+level);
                if(d.documentElement.dataset.progressionGearVisualLevel!==String(level))throw Error('gear visual marker '+level);
                const equipment=d.getElementById('equipment-window')?.innerHTML||'';
                for(const name of needles){if(!equipment.includes(name))throw Error('equipment missing '+level+' '+name);}
                if(d.querySelector('.progression-loadout-strip'))throw Error('strip returned at '+level);
                if(d.querySelector('.v5-avatar .avatar-equipped-icons'))throw Error('avatar chips returned at '+level);
                if(!d.querySelector('#atlas-avatar .avatar-character'))throw Error('character render missing '+level);
                const weapon=d.querySelector(`#equipment-window .gear-slot[data-slot="Weapon"][data-item-name="${newWeapon}"]`);
                if(!weapon?.classList.contains('progression-new-equipped'))throw Error('new weapon not marked '+level+' '+newWeapon);
                if(!weapon.querySelector('.progression-slot-marker'))throw Error('recommendation marker missing '+level);
              };

              await change(15,['Blue Plain Robe','Hardwood Wand'],'Hardwood Wand');
              if(!d.querySelector('[data-progress-skill="Magic Guard"]')?.classList.contains('unlearned'))throw Error('Magic Guard should be grey at 15');
              if(!d.querySelector('[data-progress-skill="Magic Claw"]')?.classList.contains('learned'))throw Error('Magic Claw should be active at 15');
              await change(30,['Golden Pride','Blue Wizard Robe','Mithril Wand'],'Mithril Wand');
              if(!d.querySelector('[data-progress-skill="Teleport"]')?.classList.contains('learned'))throw Error('Teleport should be active at 30');
              if(!d.querySelector('[data-progress-skill="Thunder Bolt"]')?.classList.contains('unlearned'))throw Error('Thunder Bolt should be grey at 30');
              await change(50,['Aqua Golden Circlet','Blue Calas','Cromi'],'Cromi');
              result.textContent='progression-level-sync-ok';
            }catch(e){result.textContent='progression-level-sync-failed: '+e.message;}
          });
          </script></body>
          HTML

          python3 -m http.server 4173 --directory site >/tmp/maplestory-static-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"

          for viewport in 1365,900 1024,768 800,900; do
            file="/tmp/maplestory-static-${viewport//,/-}.html"
            "$chrome" --headless --no-sandbox --disable-gpu --window-size="$viewport" --virtual-time-budget=10000 --dump-dom http://127.0.0.1:4173/ >"$file"
            for marker in visual-layer-ready visual-db-layer-ready visual-npc-layer-ready visual-skill-layer-ready visual-portal-layer-ready dashboard-polish-ready progression-sync-ready progression-level-hook-ready progression-skill-state-ready progression-gear-visual-ready progression-compact-dashboard-ready progression-gear-decision-verified skill-progression-board-ready beginner-skill-tree-ready dashboard-action-layout-ok dashboard-page-layout-ok etc-planner-fixed-ready; do
              grep -q "$marker" "$file"
            done
            grep -q 'class="atlas-action-row' "$file"
            grep -q 'class="gear-slot' "$file"
            grep -q 'class="atlas-timeline-level' "$file"
            grep -q 'data-progress-skill="Nimble Feet"' "$file"
            grep -q 'data-progress-skill="Three Snails"' "$file"
            grep -q 'data-progress-skill="Recovery"' "$file"
            ! grep -q 'class="progression-loadout-strip' "$file"
            ! grep -q 'class="avatar-equipped-icons' "$file"
            ! grep -q 'dashboard-overflow-detected' "$file"
            ! grep -q 'dashboard-page-overflow-detected' "$file"
            grep -Eq 'visual-media-strip|visualized-item-row|visual-quest-items' "$file"
            grep -q 'class="etc-recommended"' "$file"
            grep -q 'class="etc-check-wrap' "$file"
            python3 - "$file" <<'PY'
          import re, sys
          s=open(sys.argv[1], encoding='utf-8', errors='replace').read()
          held=re.findall(r'<input[^>]*data-held="[^"]+"[^>]*>', s)
          recs=re.findall(r'class="etc-recommended"', s)
          checks=re.findall(r'class="etc-check-wrap', s)
          assert len(held) >= 10, f'expected ETC held controls, got {len(held)}'
          assert all('hidden' in tag for tag in held), 'visible ETC quantity input detected'
          assert len(recs) == len(held), f'recommendation mismatch: {len(recs)} recs vs {len(held)} rows'
          assert len(checks) == len(held), f'checkbox wrapper mismatch: {len(checks)} vs {len(held)} rows'
          PY
          done

          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1365,900 --virtual-time-budget=16000 --dump-dom http://127.0.0.1:4173/ci-progression-test.html >/tmp/progression-test.html
          grep -o 'progression-level-sync-[^<]*' /tmp/progression-test.html || true
          grep -q '>progression-level-sync-ok<' /tmp/progression-test.html
          ! grep -q 'progression-level-sync-failed' /tmp/progression-test.html
          rm -f site/ci-progression-test.html

      - name: Commit generated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f site
          if git diff --cached --quiet; then
            echo 'Static site already up to date.'
          else
            git commit -m 'Build verified static deploy assets'
            git reset --hard HEAD
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
