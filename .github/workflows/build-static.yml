name: Build static site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/manifest.webmanifest'
      - 'public/visuals.js'
      - 'public/visuals.css'
      - 'public/visuals-db.js'
      - 'public/visuals-db.css'
      - 'public/visuals-npc.js'
      - 'public/visuals-npc.css'
      - 'public/visuals-skills.js'
      - 'public/visuals-skills.css'
      - 'public/visuals-portals.js'
      - 'public/visuals-portals.css'
      - 'public/dashboard-polish.js'
      - 'public/dashboard-polish.css'
      - 'public/assets/runtime/**'
      - 'public/repairs/**'
      - 'build.cjs'
      - '.github/workflows/build-static.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct verified static files
        run: |
          node build.cjs
          rm -rf site
          mv dist site
      - name: Verify static output
        run: |
          node --check site/app.js
          node --check site/guide-data.js
          node --check site/visuals.js
          node --check site/visuals-db.js
          node --check site/visuals-npc.js
          node --check site/visuals-skills.js
          node --check site/visuals-portals.js
          node --check site/dashboard-polish.js
          grep -q 'styles.css?v=0.8.1-static1' site/index.html
          grep -q 'visuals.css?v=0.8.1-static1' site/index.html
          grep -q 'visuals-db.css?v=0.8.1-static1' site/index.html
          grep -q 'visuals-npc.css?v=0.8.1-static1' site/index.html
          grep -q 'visuals-skills.css?v=0.8.1-static1' site/index.html
          grep -q 'visuals-portals.css?v=0.8.1-static1' site/index.html
          grep -q 'dashboard-polish.css?v=0.8.1-static1' site/index.html
          grep -q 'guide-data.js?v=0.8.1-static1' site/index.html
          grep -q 'app.js?v=0.8.1-static1' site/index.html
          grep -q 'visuals.js?v=0.8.1-static1' site/index.html
          grep -q 'visuals-db.js?v=0.8.1-static1' site/index.html
          grep -q 'visuals-npc.js?v=0.8.1-static1' site/index.html
          grep -q 'visuals-skills.js?v=0.8.1-static1' site/index.html
          grep -q 'visuals-portals.js?v=0.8.1-static1' site/index.html
          grep -q 'dashboard-polish.js?v=0.8.1-static1' site/index.html
          grep -q 'MapleStory Classic Builder 0.8.1-static1' site/build-info.txt
          test -s site/styles.css
          test -s site/visuals.css
          test -s site/visuals-db.css
          test -s site/visuals-npc.css
          test -s site/visuals-skills.css
          test -s site/visuals-portals.css
          test -s site/dashboard-polish.css
          test -s site/guide-data.js
          test -s site/app.js
          test -s site/visuals.js
          test -s site/visuals-db.js
          test -s site/visuals-npc.js
          test -s site/visuals-skills.js
          test -s site/visuals-portals.js
          test -s site/dashboard-polish.js
      - name: Browser boot and dashboard layout smoke test
        run: |
          python3 -m http.server 4173 --directory site >/tmp/maplestory-static-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          for viewport in 1365,900 1024,768 800,900; do
            file="/tmp/maplestory-static-${viewport//,/-}.html"
            "$chrome" --headless --no-sandbox --disable-gpu --window-size="$viewport" --virtual-time-budget=8500 --dump-dom http://127.0.0.1:4173/ >"$file"
            grep -q 'class="atlas-action-row' "$file"
            grep -q 'class="gear-slot' "$file"
            grep -q 'class="atlas-timeline-level' "$file"
            grep -q 'visual-layer-ready' "$file"
            grep -q 'visual-db-layer-ready' "$file"
            grep -q 'visual-npc-layer-ready' "$file"
            grep -q 'visual-skill-layer-ready' "$file"
            grep -q 'visual-portal-layer-ready' "$file"
            grep -q 'dashboard-polish-ready' "$file"
            grep -q 'dashboard-action-layout-ok' "$file"
            ! grep -q 'dashboard-overflow-detected' "$file"
            grep -q 'dashboard-page-layout-ok' "$file"
            ! grep -q 'dashboard-page-overflow-detected' "$file"
            grep -Eq 'visual-media-strip|visualized-item-row|visual-quest-items' "$file"
            grep -q 'etc-planner-fixed-ready' "$file"
            grep -q 'class="etc-recommended"' "$file"
            grep -q 'class="etc-check-wrap' "$file"
            python3 - "$file" <<'PY'
          import re, sys
          s=open(sys.argv[1], encoding='utf-8', errors='replace').read()
          held=re.findall(r'<input[^>]*data-held="[^"]+"[^>]*>', s)
          recs=re.findall(r'class="etc-recommended"', s)
          checks=re.findall(r'class="etc-check-wrap', s)
          assert len(held) >= 10, f'expected ETC held controls, got {len(held)}'
          assert all('hidden' in tag for tag in held), 'visible ETC quantity input detected'
          assert len(recs) == len(held), f'recommendation mismatch: {len(recs)} recs vs {len(held)} rows'
          assert len(checks) == len(held), f'checkbox wrapper mismatch: {len(checks)} vs {len(held)} rows'
          PY
          done
      - name: Commit generated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f site
          if git diff --cached --quiet; then
            echo 'Static site already up to date.'
          else
            git commit -m 'Build verified static deploy assets'
            git push
          fi
