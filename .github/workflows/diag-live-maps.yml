name: Diagnose live Maple World gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-live-maps.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate world map sources
        run: |
          set +e
          urls=(
            'https://maplestory.io/api/GMS/83/map/worldmap'
            'https://maplestory.io/api/GMS/83/map/worldmap/MapleWorld'
            'https://maplestory.io/api/GMS/83/map/worldmap/WorldMap'
            'https://maplestory.io/api/wz/img/GMS/83/Map/WorldMap/MapleWorld.img/BaseImg/0'
            'https://maplestory.io/api/wz/img/GMS/83/Map/WorldMap/WorldMap.img/BaseImg/0'
            'https://strategywiki.org/wiki/File:MS_Maple_World.png'
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            curl -sS -L --max-time 35 -A 'Mozilla/5.0' -D /tmp/h "$url" -o /tmp/b
            echo "curl=$? bytes=$(wc -c </tmp/b 2>/dev/null || echo 0) type=$(grep -i '^content-type:' /tmp/h | tail -1 | tr -d '\r')"
            head -n 8 /tmp/h || true
            head -c 500 /tmp/b | strings | head -5 || true
            echo
          done
