name: Diagnose live Maple World gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-live-maps.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Map GMS83 world sheets
        run: |
          set -e
          base='https://maplestory.io/api/GMS/83/map/worldmap'
          curl -fsSL --max-time 30 "$base" -o /tmp/names.json
          echo '=== world map IDs ==='
          cat /tmp/names.json
          echo
          jq -r '.[]' /tmp/names.json | while read -r name; do
            echo "=== $name ==="
            if curl -fsSL --max-time 40 "$base/$name" -o /tmp/w.json; then
              jq -r '[.worldMapName // "", .parentWorld // "", ((.maps // []) | map(.title // .description // "") | unique | .[0:12] | join(" | "))] | @tsv' /tmp/w.json
            else
              echo 'unavailable'
            fi
          done
