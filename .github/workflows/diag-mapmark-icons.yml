name: Probe MapleStory map-mark logos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-mapmark-icons.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WZ world map marker sprites
        run: |
          set +e
          base='https://maplestory.io/api/wz/img/GMS/83/Map/MapHelper.img/worldMap/mapImage'
          for type in 0 1 2 3 4 5; do
            code=$(curl -sS -L --max-time 25 -o /tmp/icon -w '%{http_code}' "$base/$type")
            echo "type=$type code=$code bytes=$(wc -c </tmp/icon) mime=$(file -b --mime-type /tmp/icon)"
          done
