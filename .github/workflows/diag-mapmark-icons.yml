name: Probe MapleStory map-mark logos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-mapmark-icons.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe map mark WZ images
        run: |
          set +e
          base='https://maplestory.io/api/wz/img/GMS/83/Map/MapHelper.img/mark'
          for mark in Henesys Ellinia Perion KerningCity SleepyWood Orbis ElNath Ludibrium Aquarium Leafre MuLung Ariant Magatia TempleOfTime NLC; do
            code=$(curl -sS -L --max-time 25 -o /tmp/icon -w '%{http_code}' "$base/$mark")
            echo "$mark code=$code bytes=$(wc -c </tmp/icon) type=$(file -b --mime-type /tmp/icon)"
          done
