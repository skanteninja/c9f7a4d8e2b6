name: Inspect WZ world map markers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-world-entry.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect WorldMap and Victoria entries
        run: |
          set -e
          for sheet in WorldMap WorldMap010 WorldMap020; do
            echo "===== $sheet ====="
            curl --retry 3 --retry-all-errors -fsSL --max-time 90 "https://maplestory.io/api/GMS/83/map/worldmap/$sheet" -o /tmp/w.json
            python3 - "$sheet" <<'PY'
          import json,sys
          d=json.load(open('/tmp/w.json'))
          print('top keys',sorted(d.keys()))
          print('baseImage', [{k:v for k,v in x.items() if k!='image'} for x in (d.get('baseImage') or [])[:2]])
          rows=d.get('maps') or []
          print('map count',len(rows))
          for x in rows[:5]:
              y={k:v for k,v in x.items() if k not in ('image','canvas','bitmap')}
              for k,v in x.items():
                  if k in ('image','canvas','bitmap') and isinstance(v,str): y[k]=f'<base64 {len(v)} chars>'
              print(json.dumps(y,ensure_ascii=False)[:1800])
          PY
          done
