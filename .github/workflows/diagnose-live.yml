name: Diagnose live deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live visual rewrite once
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          visuals_js="$(curl -fsSL --max-time 15 "$BASE_URL/visuals.js?diag=$GITHUB_RUN_ID" || true)"
          monster_bytes="$(curl -fsSL --max-time 20 "$BASE_URL/game-data/data/images/monsters/03b8bda63a91a4f5c89dae6f6983caf0.webp?diag=$GITHUB_RUN_ID" 2>/dev/null | wc -c || true)"
          repo=0; raw=0; noraw=0; bytes=0
          [[ "$visuals_js" == *"const REPO_RAW = '/game-data/';"* ]] && repo=1 || true
          [[ "$visuals_js" == *"const RAW = '/game-data/data/current/';"* ]] && raw=1 || true
          [[ "$visuals_js" != *"raw.githubusercontent.com/ohmi69/osms_datamine_dashboard"* ]] && noraw=1 || true
          [ "${monster_bytes:-0}" -gt 500 ] && bytes=1 || true
          echo "VISUAL-DIAG repo=$repo raw=$raw noraw=$noraw bytes=$bytes monster_bytes=$monster_bytes visuals_len=${#visuals_js}"
          printf '%s' "$visuals_js" | head -c 350 || true
