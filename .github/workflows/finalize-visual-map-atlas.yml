name: Finalize visual Maple World atlas

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-visual-map-atlas.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle visual atlas assets locally
        run: |
          set -euo pipefail
          rm -rf public/assets/map-atlas
          mkdir -p public/assets/map-atlas/{sheets,markers,marks,data} /tmp/atlas-json

          cat > /tmp/sheets.txt <<'EOF'
          maple-world WorldMap
          maple-island WorldMap000
          victoria-island WorldMap010
          nautilus WorldMap011
          sleepywood WorldMap012
          orbis-el-nath WorldMap020
          dead-mine WorldMap021
          ludus-lake WorldMap030
          clocktower WorldMap031
          aqua-road WorldMap040
          minar-forest WorldMap050
          mu-lung-garden WorldMap060
          nihal-desert WorldMap070
          temple-of-time WorldMap080
          ereve WorldMap090
          rien WorldMap100
          masteria WorldMap141
          haunted-house WorldMap142
          EOF

          export WZ_SHEET_BASE='https://maplestory.io/api/wz/img/GMS/83/Map/WorldMap'
          cat /tmp/sheets.txt | xargs -n2 -P6 bash -c '
            slug="$0"; sheet="$1";
            echo "sheet $slug <- $sheet";
            curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL --max-time 100 "$WZ_SHEET_BASE/$sheet.img/BaseImg/0" -o "public/assets/map-atlas/sheets/$slug.png";
            test "$(wc -c < "public/assets/map-atlas/sheets/$slug.png")" -gt 5000
          '

          # Preserve the exact current-Classic Victoria sheet + marker art whenever available.
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL --max-time 90 'https://meowdb.com/msclassic/worldmap/victoria-island.webp' -o public/assets/map-atlas/sheets/victoria-current.webp || true
          test "$(wc -c < public/assets/map-atlas/sheets/victoria-current.webp 2>/dev/null || echo 0)" -gt 5000 || rm -f public/assets/map-atlas/sheets/victoria-current.webp
          for kind in town spot cluster; do
            curl --retry 4 --retry-delay 2 --retry-all-errors -fsSL --max-time 45 "https://meowdb.com/msclassic/worldmap/marker-$kind.png" -o "public/assets/map-atlas/markers/current-$kind.png" || true
            test "$(wc -c < "public/assets/map-atlas/markers/current-$kind.png" 2>/dev/null || echo 0)" -gt 100 || rm -f "public/assets/map-atlas/markers/current-$kind.png"
          done

          export MAP_API='https://maplestory.io/api/GMS/83/map/worldmap'
          awk '{print $1" "$2}' /tmp/sheets.txt | xargs -n2 -P5 bash -c '
            slug="$0"; sheet="$1";
            for attempt in 1 2 3 4; do
              if curl -fsSL --max-time 110 "$MAP_API/$sheet" -o "/tmp/atlas-json/$sheet.json"; then exit 0; fi
              sleep $((attempt*2));
            done
            echo "metadata unavailable for $sheet" >&2
            exit 0
          '
          # These are required for the main visual contract.
          for sheet in WorldMap WorldMap010 WorldMap020; do
            test -s "/tmp/atlas-json/$sheet.json" || curl --retry 6 --retry-delay 3 --retry-all-errors -fsSL --max-time 150 "$MAP_API/$sheet" -o "/tmp/atlas-json/$sheet.json"
          done

          # Original WZ world-map marker sprites. If a rarely used type is absent, CSS supplies a visible fallback.
          for type in 0 1 2 3 4 5; do
            curl --retry 4 --retry-delay 1 --retry-all-errors -fsSL --max-time 45 "https://maplestory.io/api/wz/img/GMS/83/Map/MapHelper.img/worldMap/mapImage/$type" -o "public/assets/map-atlas/markers/wz-$type.png" || true
            test "$(wc -c < "public/assets/map-atlas/markers/wz-$type.png" 2>/dev/null || echo 0)" -gt 100 || rm -f "public/assets/map-atlas/markers/wz-$type.png"
          done

          # Representative original map-mark logos used on region cards.
          cat > /tmp/marks.txt <<'EOF'
          henesys Henesys
          ellinia Ellinia
          perion Perion
          kerning KerningCity
          el-nath ElNath
          ludibrium Ludibrium
          leafre Leafre
          ariant Ariant
          magatia Magatia
          nlc NLC
          mushroom-shrine MushroomShrine
          ereve Ereve
          rien Rien
          EOF
          while read -r slug mark; do
            curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL --max-time 55 "https://maplestory.io/api/wz/img/GMS/83/Map/MapHelper.img/mark/$mark" -o "public/assets/map-atlas/marks/$slug.png" || true
            test "$(wc -c < "public/assets/map-atlas/marks/$slug.png" 2>/dev/null || echo 0)" -gt 500 || rm -f "public/assets/map-atlas/marks/$slug.png"
          done < /tmp/marks.txt

          python3 - <<'PY'
          import json, pathlib
          src=pathlib.Path('/tmp/atlas-json')
          out={}
          mapping={
            'world':'WorldMap','maple-island':'WorldMap000','victoria':'WorldMap010','ossyria':'WorldMap020',
            'ludus':'WorldMap030','aqua':'WorldMap040','minar':'WorldMap050','mulung':'WorldMap060',
            'nihal':'WorldMap070','temple':'WorldMap080','ereve':'WorldMap090','rien':'WorldMap100','masteria':'WorldMap141'
          }
          for slug,sheet in mapping.items():
            p=src/f'{sheet}.json'
            if not p.exists():
              continue
            try: d=json.loads(p.read_text())
            except Exception: continue
            base=(d.get('baseImage') or [{}])[0]
            origin=base.get('origin') or base.get('originOrZero') or {'x':320,'y':235}
            ox=float(origin.get('x',320) or 320); oy=float(origin.get('y',235) or 235)
            width=max(1,int(round(ox*2))); height=max(1,int(round(oy*2)))
            markers=[]
            for row in d.get('maps') or []:
              spot=row.get('spot') or {}
              if 'x' not in spot or 'y' not in spot: continue
              nums=[]
              for n in row.get('mapNumbers') or []:
                try: nums.append(int(n))
                except Exception: pass
              markers.append({
                'x':round(ox+float(spot.get('x') or 0),2),
                'y':round(oy+float(spot.get('y') or 0),2),
                'type':int(row.get('type') or 0),
                'maps':nums[:16],
                'label':str(row.get('description') or row.get('title') or '').strip()
              })
            out[slug]={'sheet':sheet,'width':width,'height':height,'markers':markers}
          target=pathlib.Path('public/assets/map-atlas/data/markers.json')
          target.write_text(json.dumps(out,separators=(',',':')),encoding='utf-8')
          print('atlas marker counts:',{k:len(v['markers']) for k,v in out.items()})
          assert len(out.get('world',{}).get('markers',[]))>=10
          assert len(out.get('victoria',{}).get('markers',[]))>=50
          assert len(out.get('ossyria',{}).get('markers',[]))>=20
          PY

      - name: Install visual atlas renderer and build support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('public/maps-tab.js'); s=p.read_text()
          if "const ATLAS_ROOT='/assets/map-atlas/';" not in s:
            s=s.replace("  const LEGACY_INDEX='/game-data/legacy/maps.json';", "  const LEGACY_INDEX='/game-data/legacy/maps.json';\n  const ATLAS_ROOT='/assets/map-atlas/';")

          victoria='victoria-current.webp' if Path('public/assets/map-atlas/sheets/victoria-current.webp').exists() else 'victoria-island.png'
          marks=Path('public/assets/map-atlas/marks')
          def mark(name):
            return f"`${{ATLAS_ROOT}}marks/{name}.png`" if (marks/f'{name}.png').exists() else "''"
          continents=f"""  const CONTINENTS=[
            {{id:'maple-island',name:'Maple Island',subtitle:'Amherst · Southperry',image:`${{ATLAS_ROOT}}sheets/maple-island.png`,mark:'',aliases:'maple island amherst southperry beginner island'}},
            {{id:'victoria',name:'Victoria Island',subtitle:'Henesys · Ellinia · Perion · Kerning · Sleepywood',image:`${{ATLAS_ROOT}}sheets/{victoria}`,mark:{mark('henesys')},aliases:'victoria henesys ellinia perion kerning lith sleepywood dungeon ant tunnel florina nautilus'}},
            {{id:'ossyria',name:'Orbis / El Nath Mts.',subtitle:'Orbis · El Nath · Dead Mine',image:`${{ATLAS_ROOT}}sheets/orbis-el-nath.png`,mark:{mark('el-nath')},aliases:'ossyria orbis el nath elnath dead mine snow mountain zakum'}},
            {{id:'ludus',name:'Ludus Lake',subtitle:'Ludibrium · Omega Sector · Korean Folk Town',image:`${{ATLAS_ROOT}}sheets/ludus-lake.png`,mark:{mark('ludibrium')},aliases:'ludus lake ludibrium omega sector korean folk town eos helios clocktower'}},
            {{id:'aqua',name:'Aqua Road',subtitle:'Aquarium · Deep Sea',image:`${{ATLAS_ROOT}}sheets/aqua-road.png`,mark:'',aliases:'aqua road aquarium deep sea ocean'}},
            {{id:'minar',name:'Minar Forest',subtitle:'Leafre · Dragon Forest',image:`${{ATLAS_ROOT}}sheets/minar-forest.png`,mark:{mark('leafre')},aliases:'minar forest leafre dragon canyon'}},
            {{id:'mulung',name:'Mu Lung Garden',subtitle:'Mu Lung · Herb Town',image:`${{ATLAS_ROOT}}sheets/mu-lung-garden.png`,mark:'',aliases:'mu lung mulung herb town garden'}},
            {{id:'nihal',name:'Nihal Desert',subtitle:'Ariant · Magatia',image:`${{ATLAS_ROOT}}sheets/nihal-desert.png`,mark:{mark('ariant')},aliases:'nihal desert ariant magatia alchemy'}},
            {{id:'temple',name:'Temple of Time',subtitle:'Three Doors · Time Lane',image:`${{ATLAS_ROOT}}sheets/temple-of-time.png`,mark:'',aliases:'temple of time three doors time lane memory road'}},
            {{id:'ereve',name:'Ereve',subtitle:'Cygnus Knights · Forest of Beginning',image:`${{ATLAS_ROOT}}sheets/ereve.png`,mark:{mark('ereve')},aliases:'ereve cygnus knights forest of beginning'}},
            {{id:'rien',name:'Rien',subtitle:'Aran · Snow Island',image:`${{ATLAS_ROOT}}sheets/rien.png`,mark:{mark('rien')},aliases:'rien aran snow island'}},
            {{id:'world-tour',name:'World Tour',subtitle:'Zipangu · Showa · Singapore and more',image:'',mark:{mark('mushroom-shrine')},aliases:'world tour zipangu mushroom shrine showa singapore malaysia thailand taiwan'}},
            {{id:'masteria',name:'Masteria',subtitle:'New Leaf City · Haunted House',image:`${{ATLAS_ROOT}}sheets/masteria.png`,mark:{mark('nlc')},aliases:'masteria new leaf city nlc haunted house crimsonwood'}},
            {{id:'other',name:'Other / Event',subtitle:'PQ · event · special maps',image:'',mark:'',aliases:'event pq party quest hidden special'}}
          ];"""
          s,n=re.subn(r"  const CONTINENTS=\[[\s\S]*?\n  \];",continents,s,count=1)
          assert n==1,'CONTINENTS block not replaced'

          s=s.replace("explorerLimit:120};", "explorerLimit:120,atlas:null,atlasLoading:null};")
          anchor="  const continentConfig=id=>CONTINENTS.find(x=>x.id===id)||CONTINENTS.at(-1);"
          helpers=r'''  const atlasMarkerUrl=type=>`${ATLAS_ROOT}markers/wz-${Number(type)||0}.png`;
          async function loadAtlas(){
            if(state.atlas)return state.atlas;if(state.atlasLoading)return state.atlasLoading;
            state.atlasLoading=fetch(`${ATLAS_ROOT}data/markers.json`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('atlas markers '+r.status);return r.json();}).then(x=>{state.atlas=x||{};return state.atlas;}).catch(()=>{state.atlas={};return state.atlas;});return state.atlasLoading;
          }
          function atlasMapFor(point){for(const raw of point?.maps||[]){const id=padMap(raw),cur=state.byId.get(id),old=state.byRef.get(`l:${id}`)||state.byRef.get(`l:${String(Number(raw))}`);if(cur)return cur;if(old)return old;}return null;}
          function atlasContinentFor(point){const hit=atlasMapFor(point);if(hit)return hit.__continent;const raw=point?.maps?.[0];return raw==null?'other':continentFor({id:String(raw),source:'legacy',name:'',street_name:''});}
          function setAtlasReady(){const img=q('#maps-full-world-image'),meta=state.atlas?.world;if(img?.complete&&img.naturalWidth>200&&meta?.markers?.length>=10)document.documentElement.classList.add('maps-atlas-visual-ready');}
          function renderWorldAtlasMarkers(){const host=q('#maps-continent-hotspots'),meta=state.atlas?.world;if(!host||!meta?.markers?.length)return;host.innerHTML='';for(const point of meta.markers){const cid=atlasContinentFor(point);if(cid==='other')continue;const c=continentConfig(cid),map=atlasMapFor(point),label=point.label||map?.name||c.name;const b=document.createElement('button');b.type='button';b.className=`maps-atlas-world-point type-${point.type}${Number(point.type)===3?' major':''}`;b.dataset.continent=cid;b.style.left=`${point.x/meta.width*100}%`;b.style.top=`${point.y/meta.height*100}%`;b.title=`${label} · ${c.name}`;b.innerHTML=`<img src="${atlasMarkerUrl(point.type)}" alt=""><span>${esc(label)}</span>`;const icon=b.querySelector('img');icon?.addEventListener('error',()=>{icon.remove();b.classList.add('sprite-fallback')});b.addEventListener('click',()=>openContinent(cid));host.appendChild(b);}setAtlasReady();}
          function renderAtlasSheetMarkers(id){const host=q('#maps-sheet-markers'),meta=state.atlas?.[id];if(!host||!meta?.markers?.length)return;host.innerHTML='';for(const point of meta.markers){const map=atlasMapFor(point);if(!map)continue;const b=document.createElement('button');b.type='button';b.className=`atlas-map-point type-${point.type}`;b.dataset.mapId=padMap(map.id);b.style.left=`${point.x/meta.width*100}%`;b.style.top=`${point.y/meta.height*100}%`;b.title=`${map.name} · #${map.id}`;b.innerHTML=`<img src="${atlasMarkerUrl(point.type)}" alt=""><span>${esc(map.name)}</span>`;const icon=b.querySelector('img');icon?.addEventListener('error',()=>{icon.remove();b.classList.add('sprite-fallback')});b.addEventListener('click',()=>showDetail(map.__ref,'continent',id));host.appendChild(b);}document.documentElement.classList.add('maps-sheet-markers-ready');}
          function continentArt(c){const art=c.image?`<img class="maps-continent-art-image" src="${c.image}" alt="${esc(c.name)} world map" loading="lazy">`:'';const logo=c.mark?`<img class="maps-continent-logo" src="${c.mark}" alt="" loading="lazy">`:'';return `<span class="maps-continent-art">${art}<span class="maps-continent-logo-shell">${logo}</span></span>`;}
          '''
          if 'function renderWorldAtlasMarkers()' not in s:
            s=s.replace(anchor,anchor+'\n\n'+helpers)

          s=s.replace('<div class="maps-full-world-stage"><img id="maps-full-world-image" src="/game-media/worldmap-legacy/maple-world.png" alt="Maple World"><div id="maps-continent-hotspots"></div></div>', '<div class="maps-full-world-stage"><div class="maps-world-canvas"><img id="maps-full-world-image" src="${ATLAS_ROOT}sheets/maple-world.png" alt="Maple World"><div id="maps-continent-hotspots"></div></div></div><div class="maps-world-visual-key"><span><b>Original Maple World sheet</b> · click a Maple marker to open its region</span><span>Current Classic records remain preferred wherever available.</span></div>')

          start=s.index('  function renderWorld(){')
          end=s.index('\n\n  function renderVictoriaMarkers()',start)
          new_render=r'''  function renderWorld(){
            setView('world');const count=q('#maps-world-count');if(count)count.textContent=`${state.current.length} current Classic records · ${state.legacy.length} old-school records · ${state.maps.length} merged maps`;
            const grid=q('#maps-continent-grid'),hot=q('#maps-continent-hotspots');if(!grid||!hot)return;grid.innerHTML='';hot.innerHTML='';
            for(const c of CONTINENTS){const rows=mapsForContinent(c.id);if(!rows.length&&c.id==='other')continue;const current=rows.filter(m=>m.source==='current').length,legacy=rows.filter(m=>m.source==='legacy').length;const card=document.createElement('button');card.type='button';card.className='maps-continent-card';card.dataset.continent=c.id;card.innerHTML=`${continentArt(c)}<span class="maps-continent-copy"><b>${esc(c.name)}</b><small>${esc(c.subtitle)}</small><em><strong>${rows.length}</strong> maps${current?` · ${current} current`:''}${legacy?` · ${legacy} legacy-only`:''}</em></span>`;card.querySelectorAll('img').forEach(im=>im.addEventListener('error',()=>im.remove()));card.addEventListener('click',()=>openContinent(c.id));grid.appendChild(card);}
            const worldImg=q('#maps-full-world-image');worldImg?.addEventListener('load',setAtlasReady,{once:true});worldImg?.addEventListener('error',()=>document.documentElement.classList.add('maps-atlas-image-error'),{once:true});loadAtlas().then(()=>{renderWorldAtlasMarkers();setAtlasReady();});document.documentElement.classList.add('maps-world-ready');
          }'''
          s=s[:start]+new_render+s[end:]

          # Keep current Victoria's exact clickable marker coordinates, but make its marker art local too.
          s=s.replace("`/game-media/worldmap/marker-${type==='cluster'?'cluster':type==='town'?'town':'spot'}.png`", "`${ATLAS_ROOT}markers/current-${type==='cluster'?'cluster':type==='town'?'town':'spot'}.png`")

          old="if(id==='victoria'){renderVictoriaMarkers();note.innerHTML='<span><i class=\"town\"></i>Town</span><span><i class=\"spot\"></i>Field / route</span><span><i class=\"cluster\"></i>Dungeon cluster</span><small>Victoria keeps the exact clickable Classic World markers.</small>';}else{q('#maps-sheet-markers').innerHTML='';note.innerHTML='<small>Old-school region sheet for orientation. Use the map list beside it to open the actual maps; current Classic records are preferred wherever available.</small>';}"
          new="if(id==='victoria'){renderVictoriaMarkers();note.innerHTML='<span><i class=\"town\"></i>Town</span><span><i class=\"spot\"></i>Field / route</span><span><i class=\"cluster\"></i>Dungeon cluster</span><small>Victoria keeps the exact clickable current-Classic markers.</small>';}else{q('#maps-sheet-markers').innerHTML='';loadAtlas().then(()=>renderAtlasSheetMarkers(id));note.innerHTML='<small>Original old-school world sheet with clickable WZ map points. Current Classic records are preferred wherever available.</small>';}"
          assert old in s,'openContinent marker branch missing'
          s=s.replace(old,new)
          s=s.replace("img.src=c.image||'/game-media/worldmap-legacy/maple-world.png';", "img.src=c.image||`${ATLAS_ROOT}sheets/maple-world.png`;")

          # Make database search itself visual instead of text-only.
          rs=s.index('  function renderMapRows('); re_=s.index('\n  function renderContinentList()',rs)
          render_rows=r'''  function renderMapRows(host,rows,limit=180){host.innerHTML='';for(const map of rows.slice(0,limit)){const b=document.createElement('button');b.type='button';b.className='maps-db-row';b.dataset.mapRef=map.__ref;const thumb=mapImage(map);b.innerHTML=`<span class="maps-db-thumb"><img src="${thumb}" alt="" loading="lazy"></span><span class="maps-db-main"><b>${esc(map.name)}</b><small>${esc(map.street_name||continentConfig(map.__continent).name)}</small></span><span class="map-source-pill ${sourceClass(map)}">${sourceLabel(map)}</span><code>#${esc(String(map.id))}</code>`;const im=b.querySelector('.maps-db-thumb img');im?.addEventListener('error',()=>{im.remove();b.querySelector('.maps-db-thumb')?.classList.add('empty')});b.addEventListener('click',()=>showDetail(map.__ref,state.view,state.continent));host.appendChild(b);}}'''
          s=s[:rs]+render_rows+s[re_:]

          p.write_text(s)

          css=Path('public/maps-tab.css')
          c=css.read_text()
          marker='/* MAP ATLAS VISUAL V2 */'
          if marker in c: c=c.split(marker)[0].rstrip()+'\n'
          c+=r'''
          /* MAP ATLAS VISUAL V2 */
          .maps-full-world{padding:16px}.maps-full-world-stage{display:grid;place-items:center;min-height:0;padding:14px;overflow:auto;border-color:rgba(123,183,255,.16);background:radial-gradient(circle at 50% 35%,rgba(74,142,190,.12),transparent 58%),linear-gradient(180deg,#070b14,#04070e)}
          .maps-world-canvas{position:relative;width:min(100%,980px);aspect-ratio:640/470;margin:auto}.maps-world-canvas>#maps-full-world-image{display:block;width:100%;height:100%;min-height:0;max-height:none;object-fit:contain;opacity:1;filter:drop-shadow(0 20px 35px rgba(0,0,0,.46))}.maps-world-canvas>#maps-continent-hotspots{position:absolute;inset:0}
          .maps-world-visual-key{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:10px auto 0;max-width:980px;color:var(--dim);font-size:9px}.maps-world-visual-key b{color:var(--muted);font-size:10px}
          .maps-atlas-world-point{position:absolute;z-index:4;display:grid;place-items:center;width:28px;height:32px;padding:0;border:0;background:transparent;transform:translate(-50%,-50%);cursor:pointer;filter:drop-shadow(0 3px 5px rgba(0,0,0,.88));transition:transform .12s ease,filter .12s ease}.maps-atlas-world-point img{display:block;max-width:26px;max-height:30px;image-rendering:auto}.maps-atlas-world-point.sprite-fallback:before{content:'';width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:var(--map-cyan);box-shadow:0 0 0 3px rgba(5,10,18,.75)}.maps-atlas-world-point span{position:absolute;left:50%;top:calc(100% + 2px);display:none;min-width:max-content;max-width:150px;transform:translateX(-50%);padding:3px 6px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:rgba(4,8,15,.93);color:#fff;font-size:9px;font-weight:900;line-height:1.1;text-align:center;white-space:nowrap}.maps-atlas-world-point.major span,.maps-atlas-world-point:hover span,.maps-atlas-world-point:focus-visible span{display:block}.maps-atlas-world-point:hover,.maps-atlas-world-point:focus-visible{z-index:20;transform:translate(-50%,-50%) scale(1.32);filter:drop-shadow(0 0 9px rgba(86,217,255,.9));outline:none}
          .maps-continent-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:14px}.maps-continent-card{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;gap:12px;min-height:104px;padding:9px;overflow:hidden;border-color:rgba(255,255,255,.09);background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(255,255,255,.012))}.maps-continent-card:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.24)}.maps-continent-art{position:relative;display:grid;place-items:center;overflow:hidden;width:132px;height:84px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:radial-gradient(circle,rgba(86,217,255,.08),transparent 65%),#050914}.maps-continent-art-image{width:100%;height:100%;object-fit:cover;filter:saturate(.94) contrast(1.03)}.maps-continent-logo-shell{position:absolute;right:5px;bottom:5px;display:grid;place-items:center;min-width:35px;min-height:35px;padding:3px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(3,7,13,.86);box-shadow:0 4px 13px rgba(0,0,0,.45)}.maps-continent-logo-shell:empty{display:none}.maps-continent-logo{max-width:38px;max-height:32px;object-fit:contain;image-rendering:auto}.maps-continent-copy{display:grid;gap:4px;min-width:0}.maps-continent-copy b{font-size:13px}.maps-continent-copy small{overflow:hidden;color:var(--muted);font-size:9px;text-overflow:ellipsis;white-space:nowrap}.maps-continent-copy em{color:var(--dim);font-size:8px;font-style:normal}.maps-continent-copy em strong{color:var(--map-cyan);font-size:10px}
          .maps-sheet-scroll{display:grid;place-items:start center;min-height:0;padding:8px}.maps-sheet-stage{position:relative;display:block;width:max-content;max-width:100%;min-height:0;margin:auto}.maps-sheet-stage>img{display:block;width:auto;max-width:100%;height:auto;margin:auto}.maps-sheet-stage>#maps-sheet-markers{position:absolute;inset:0;margin:0;max-width:none}.maps-sheet-stage.victoria-sheet{min-width:min(954px,100%)}.maps-sheet-stage.victoria-sheet>img{width:954px;max-width:none}
          .atlas-map-point{position:absolute;z-index:4;width:24px;height:28px;padding:0;border:0;background:transparent;transform:translate(-50%,-60%);cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.82));transition:transform .1s ease,filter .1s ease}.atlas-map-point img{display:block;max-width:22px;max-height:26px;margin:auto}.atlas-map-point.sprite-fallback:before{content:'';display:block;width:9px;height:9px;margin:auto;border:2px solid #fff;border-radius:50%;background:var(--map-cyan)}.atlas-map-point span{position:absolute;left:50%;top:100%;display:none;transform:translateX(-50%);min-width:max-content;max-width:150px;padding:3px 5px;border:1px solid rgba(255,255,255,.18);border-radius:5px;background:rgba(3,7,13,.94);color:#fff;font-size:8px;font-weight:900;white-space:nowrap}.atlas-map-point.type-0 span,.atlas-map-point:hover span,.atlas-map-point:focus-visible span{display:block}.atlas-map-point:hover,.atlas-map-point:focus-visible{z-index:18;transform:translate(-50%,-60%) scale(1.28);filter:drop-shadow(0 0 7px rgba(86,217,255,.8));outline:none}
          .maps-db-row{grid-template-columns:48px minmax(0,1fr) auto auto;padding:7px 9px}.maps-db-thumb{display:grid;place-items:center;overflow:hidden;width:44px;height:36px;border:1px solid rgba(255,255,255,.07);border-radius:7px;background:#050914}.maps-db-thumb img{max-width:100%;max-height:100%;object-fit:contain}.maps-db-thumb.empty:after{content:'MAP';color:rgba(255,255,255,.22);font-size:7px;font-weight:1000;letter-spacing:.1em}
          @media(max-width:1150px){.maps-continent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.maps-continent-card{grid-template-columns:120px minmax(0,1fr)}.maps-continent-art{width:120px}}
          @media(max-width:700px){.maps-full-world-stage{padding:5px}.maps-world-visual-key{display:grid}.maps-continent-grid{grid-template-columns:1fr}.maps-continent-card{grid-template-columns:108px minmax(0,1fr)}.maps-continent-art{width:108px;height:72px}.maps-atlas-world-point{width:22px;height:26px}.maps-atlas-world-point.major span{display:none}.maps-atlas-world-point:hover span{display:block}.maps-db-row{grid-template-columns:42px minmax(0,1fr) auto}.maps-db-row code{display:none}}
          '''
          css.write_text(c)

          b=Path('build.cjs'); t=b.read_text()
          needle="fs.writeFileSync(path.join(out, 'index.html'), html);"
          copy="""fs.writeFileSync(path.join(out, 'index.html'), html);\nconst atlasAssets = path.join(source, 'assets', 'map-atlas');\nif (fs.existsSync(atlasAssets)) fs.cpSync(atlasAssets, path.join(out, 'assets', 'map-atlas'), { recursive: true });"""
          if 'const atlasAssets =' not in t:
            assert needle in t,'build copy insertion missing'
            t=t.replace(needle,copy,1)
          b.write_text(t)
          PY

          node --check public/maps-tab.js
          grep -q 'maps-atlas-visual-ready' public/maps-tab.js
          grep -q 'MAP ATLAS VISUAL V2' public/maps-tab.css
          grep -q "const atlasAssets" build.cjs

      - name: Build and browser-test visual atlas
        run: |
          set -euo pipefail
          node build.cjs
          test "$(wc -c < dist/assets/map-atlas/sheets/maple-world.png)" -gt 100000
          test "$(wc -c < dist/assets/map-atlas/sheets/orbis-el-nath.png)" -gt 5000
          test -s dist/assets/map-atlas/data/markers.json
          python3 - <<'PY'
          import json
          d=json.load(open('dist/assets/map-atlas/data/markers.json'))
          assert len(d['world']['markers'])>=10
          assert len(d['victoria']['markers'])>=50
          assert len(d['ossyria']['markers'])>=20
          PY

          cat > dist/ci-visual-atlas.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><iframe id="app" src="/"></iframe><div id="ci-result">pending</div><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms)),frame=document.getElementById('app'),result=document.getElementById('ci-result');
          frame.addEventListener('load',async()=>{try{const d=frame.contentDocument,w=frame.contentWindow;const wait=async(fn,label,n=180)=>{for(let i=0;i<n;i++){if(fn())return;await delay(250)}throw Error('timeout '+label)};
          await wait(()=>d.documentElement.classList.contains('maps-tab-ready'),'maps');const nav=d.querySelector('#nav .nav-btn[data-page="maps"]');if(!nav)throw Error('maps nav');nav.click();
          await wait(()=>d.documentElement.classList.contains('maps-atlas-visual-ready'),'visual ready');const world=d.getElementById('maps-full-world-image');if(!world||!world.complete||world.naturalWidth<200)throw Error('world image');if(d.querySelectorAll('.maps-atlas-world-point').length<10)throw Error('world marker icons');if(d.querySelectorAll('.maps-continent-card').length<10)throw Error('continent cards');if(d.querySelectorAll('.maps-continent-art-image').length<9)throw Error('continent artwork');
          const vic=d.querySelector('.maps-continent-card[data-continent="victoria"]');vic.click();await wait(()=>d.getElementById('maps-continent')?.classList.contains('active'),'victoria');await wait(()=>d.getElementById('maps-sheet-image')?.complete&&d.getElementById('maps-sheet-image').naturalWidth>200,'victoria art');if(d.querySelectorAll('.world-map-marker').length<50)throw Error('current victoria markers');
          d.getElementById('maps-local-back').click();await wait(()=>d.getElementById('maps-world')?.classList.contains('active'),'world back');const os=d.querySelector('.maps-continent-card[data-continent="ossyria"]');os.click();await wait(()=>d.getElementById('maps-sheet-image')?.complete&&d.getElementById('maps-sheet-image').naturalWidth>200,'ossyria art');await wait(()=>d.querySelectorAll('.atlas-map-point').length>=20,'ossyria marker icons');
          result.textContent='visual-atlas-ok';}catch(e){result.textContent='visual-atlas-failed: '+e.message;}});
          </script></body>
          HTML
          python3 .github/ci_static_proxy.py --directory dist --port 4173 >/tmp/atlas-http.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"; test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1440,1050 --virtual-time-budget=65000 --dump-dom http://127.0.0.1:4173/ci-visual-atlas.html >/tmp/atlas-test.html
          grep -o 'visual-atlas-[^<]*' /tmp/atlas-test.html || true
          grep -q '>visual-atlas-ok<' /tmp/atlas-test.html
          rm -f dist/ci-visual-atlas.html

      - name: Commit verified visual atlas and generated site
        run: |
          set -euo pipefail
          rm -rf site
          mv dist site
          rm -f \
            .github/workflows/finalize-visual-map-atlas.yml \
            .github/workflows/install-map-atlas-assets.yml \
            .github/workflows/diag-world-entry.yml \
            .github/workflows/diag-mapmark-icons.yml \
            .github/workflows/diag-world-labels.yml \
            .github/workflows/diag-world-list.yml \
            .github/workflows/diag-live-maps.yml \
            .github/workflows/patch-map-world-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f public/assets/map-atlas site
          git commit -m 'Maps: restore visual Maple World atlas'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify visual atlas reached Cloudflare
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          set -euo pipefail
          ready=0
          for i in {1..70}; do
            js="$(curl -fsSL --max-time 15 "$BASE_URL/maps-tab.js?atlas=$GITHUB_RUN_ID" || true)"
            world_bytes="$(curl -fsSL --max-time 25 "$BASE_URL/assets/map-atlas/sheets/maple-world.png?atlas=$GITHUB_RUN_ID" 2>/dev/null | wc -c || true)"
            markers="$(curl -fsSL --max-time 20 "$BASE_URL/assets/map-atlas/data/markers.json?atlas=$GITHUB_RUN_ID" || true)"
            if printf '%s' "$js" | grep -q 'maps-atlas-visual-ready' && [ "${world_bytes:-0}" -gt 100000 ] && printf '%s' "$markers" | grep -q '"ossyria"'; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"; test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1440,1050 --virtual-time-budget=50000 --dump-dom "$BASE_URL/?atlas=$GITHUB_RUN_ID" >/tmp/live-atlas.html
          grep -q 'maps-atlas-visual-ready' /tmp/live-atlas.html
          grep -q 'maps-continent-art-image' /tmp/live-atlas.html
          grep -q 'maps-atlas-world-point' /tmp/live-atlas.html
