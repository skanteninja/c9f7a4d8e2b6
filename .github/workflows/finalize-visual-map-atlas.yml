name: Finalize visual Maple World atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-visual-map-atlas.yml'
      - '.github/scripts/finalize_map_atlas.py'
      - '.github/scripts/run_visual_atlas_finalize.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, verify, commit and deploy visual atlas
        run: bash .github/scripts/run_visual_atlas_finalize.sh
