name: Fix build syntax temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-build-syntax-temp.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair build regex escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.cjs')
          s=p.read_text()
          old=r"const tokenRe = /<\\/?section\\b[^>]*>/gi;"
          new=r"const tokenRe = /<\/?section\b[^>]*>/gi;"
          old2=r"if (/^<section\\b/i.test(token[0])) depth += 1;"
          new2=r"if (/^<section\b/i.test(token[0])) depth += 1;"
          assert old in s, 'token regex target missing'
          assert old2 in s, 'section regex target missing'
          s=s.replace(old,new,1).replace(old2,new2,1)
          p.write_text(s)
          PY
          git rm .github/workflows/fix-build-syntax-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.cjs
          git commit -m 'Repair public build section parser'
          git push
