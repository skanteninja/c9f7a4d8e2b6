name: Inspect merged level auto gear temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-merged-level-temp.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node build.cjs
          python3 -m http.server 4173 --directory dist >/tmp/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          cat > dist/diag.html <<'HTML'
          <!doctype html><body><iframe id="f" src="/"></iframe><pre id="out">pending</pre><script>
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          f.onload=async()=>{
            const w=f.contentWindow,d=f.contentDocument,o=document.getElementById('out');
            await wait(1500);
            const snap=label=>{
              let st={};try{st=JSON.parse(w.localStorage.getItem('ultimateILGuideState.v1')||'{}')}catch{}
              const eq=d.getElementById('equipment-window');
              const names=[...eq.querySelectorAll('.gear-slot[data-item-name]')].map(x=>x.dataset.itemName).filter(x=>x&&x!=='None');
              return {label,top:d.getElementById('level-select')?.value,hero:d.getElementById('hero-level-select')?.value,auto:d.documentElement.dataset.autoGearLevel,gear:st.gear,names};
            };
            const rows=[snap('initial')];
            const sel=d.getElementById('level-select');sel.value='15';sel.dispatchEvent(new w.Event('change',{bubbles:true}));
            await wait(300);rows.push(snap('300ms'));
            await wait(900);rows.push(snap('1200ms'));
            d.getElementById('preset-efficient')?.click();
            await wait(300);rows.push(snap('after-direct-click'));
            o.textContent=JSON.stringify(rows,null,2);
          };
          </script></body>
          HTML
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1365,900 --virtual-time-budget=8000 --dump-dom http://127.0.0.1:4173/diag.html > /tmp/diag-dom.html
          sed -n '/<pre id="out">/,/<\/pre>/p' /tmp/diag-dom.html
