name: Inspect skill DB temp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.cjs
      - name: Inspect rendered Magic Guard DB card
        run: |
          python3 .github/ci_static_proxy.py --directory dist --port 4173 >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          cat > dist/inspect-skill-db.html <<'HTML'
          <!doctype html><meta charset="utf-8"><iframe id="app" src="/" style="width:1200px;height:900px"></iframe><pre id="out">pending</pre><script>
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const f=document.getElementById('app');
          f.addEventListener('load',async()=>{
            const d=f.contentDocument,w=f.contentWindow,out=document.getElementById('out');
            try{
              for(let i=0;i<80&&!d.documentElement.classList.contains('dashboard-avatar-level-footer-ready');i++)await wait(100);
              d.querySelector('#nav .nav-btn[data-page="classicdb"]')?.click();
              await wait(500);
              const ds=d.getElementById('db-dataset'),q=d.getElementById('db-search');
              ds.value='skills';ds.dispatchEvent(new w.Event('change',{bubbles:true}));ds.dispatchEvent(new w.Event('input',{bubbles:true}));
              await wait(600);
              q.value='Magic Guard';q.dispatchEvent(new w.Event('input',{bubbles:true}));q.dispatchEvent(new w.Event('change',{bubbles:true}));
              await wait(2600);
              const cards=[...d.querySelectorAll('#db-results .db-card')];
              const card=cards.find(c=>String(c.querySelector('h3')?.textContent||'').trim()==='Magic Guard')||cards[0];
              const imgs=[...(card?.querySelectorAll('img')||[])].map(im=>({alt:im.alt,src:im.getAttribute('src'),cls:im.className,skillId:im.dataset.skillId,skillName:im.dataset.skillName,policy:im.dataset.skillIconPolicy,fallbacks:im.dataset.assetFallbacks,parent:im.parentElement?.className}));
              out.textContent=JSON.stringify({dataset:ds.value,query:q.value,count:cards.length,htmlClass:d.documentElement.className,title:card?.querySelector('h3')?.textContent,codes:[...(card?.querySelectorAll('code')||[])].map(x=>x.textContent),cardDataset:card?.dataset,imgs,html:card?.outerHTML},null,2);
            }catch(e){out.textContent='ERR '+e.stack;}
          });
          </script>
          HTML
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom http://127.0.0.1:4173/inspect-skill-db.html > /tmp/inspect.html
          sed -n '/<pre id="out">/,/<\/pre>/p' /tmp/inspect.html
