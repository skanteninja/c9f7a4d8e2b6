name: Bundle Maple World atlas artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-map-atlas-assets.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical GMS83 world map sheets and metadata
        run: |
          set -euo pipefail
          mkdir -p public/assets/map-atlas/sheets public/assets/map-atlas/data
          base='https://maplestory.io/api/wz/img/GMS/83/Map/WorldMap'
          declare -A sheets=(
            [maple-world]='WorldMap'
            [maple-island]='WorldMap000'
            [victoria-island]='WorldMap010'
            [nautilus]='WorldMap011'
            [sleepywood]='WorldMap012'
            [orbis-el-nath]='WorldMap020'
            [dead-mine]='WorldMap021'
            [ludus-lake]='WorldMap030'
            [clocktower]='WorldMap031'
            [aqua-road]='WorldMap040'
            [minar-forest]='WorldMap050'
            [mu-lung-garden]='WorldMap060'
            [nihal-desert]='WorldMap070'
            [temple-of-time]='WorldMap080'
            [ereve]='WorldMap090'
            [rien]='WorldMap100'
            [masteria]='WorldMap141'
            [haunted-house]='WorldMap142'
          )
          for slug in "${!sheets[@]}"; do
            sheet="${sheets[$slug]}"
            echo "Downloading $slug ($sheet)"
            curl --retry 4 --retry-all-errors -fsSL --max-time 90 "$base/$sheet.img/BaseImg/0" -o "public/assets/map-atlas/sheets/$slug.png"
            test "$(wc -c < "public/assets/map-atlas/sheets/$slug.png")" -gt 5000
          done
          api='https://maplestory.io/api/GMS/83/map/worldmap'
          for sheet in WorldMap WorldMap000 WorldMap010 WorldMap020 WorldMap030 WorldMap040 WorldMap050 WorldMap060 WorldMap070 WorldMap080 WorldMap090 WorldMap100 WorldMap141; do
            curl --retry 3 --retry-all-errors -fsSL --max-time 120 "$api/$sheet" -o "public/assets/map-atlas/data/$sheet.json"
            test "$(wc -c < "public/assets/map-atlas/data/$sheet.json")" -gt 100
          done
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('public/assets/map-atlas/data')
          sample=json.loads((root/'WorldMap.json').read_text())
          print('WorldMap keys:', sorted(sample.keys()))
          maps=sample.get('maps') or sample.get('mapList') or []
          print('WorldMap entries:', len(maps))
          if maps:
              print('Sample entry keys:', sorted(maps[0].keys()))
          PY
      - name: Commit bundled atlas assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/assets/map-atlas
          git commit -m 'Bundle Maple World atlas artwork' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
