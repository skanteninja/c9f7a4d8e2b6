name: Maps and ETC regression

# Atlas checkpoint: validate WZ point resolution against current Classic-first map records.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/maps-tab.js'
      - 'public/maps-tab.css'
      - 'public/assets/map-atlas/**'
      - 'public/etc-audit-data.js'
      - 'public/etc-audit-ui.js'
      - 'public/etc-audit-ui.css'
      - 'public/quest-audit-additions.js'
      - 'build.cjs'
      - 'worker.js'
      - '.github/ci_static_proxy.py'
      - '.github/workflows/maps-etc-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source and local atlas
        run: |
          for f in maps-tab etc-audit-data etc-audit-ui quest-audit-additions; do node --check "public/$f.js"; test -s "public/$f.js"; done
          node --check worker.js
          python3 -m py_compile .github/ci_static_proxy.py
          grep -q "const LEGACY_INDEX='/game-data/legacy/maps.json'" public/maps-tab.js
          grep -q 'maps-explorer-ready' public/maps-tab.js
          grep -q 'maps-atlas-visual-ready' public/maps-tab.js
          grep -q "name:'Orbis / El Nath Mts.'" public/maps-tab.js
          test "$(wc -c < public/assets/map-atlas/sheets/maple-world.png)" -gt 100000
          test "$(wc -c < public/assets/map-atlas/sheets/victoria-island.png)" -gt 5000
          test "$(wc -c < public/assets/map-atlas/sheets/orbis-el-nath.png)" -gt 5000
          test -s public/assets/map-atlas/data/markers.json

      - name: Build current static site
        run: node build.cjs

      - name: Verify generated site and atlas copy
        run: |
          for f in maps-tab.js maps-tab.css etc-audit-data.js quest-audit-additions.js etc-audit-ui.js etc-audit-ui.css; do
            test -s "dist/$f"
            grep -q "$f?v=0.8.3-static1" dist/index.html
          done
          test "$(wc -c < dist/assets/map-atlas/sheets/maple-world.png)" -gt 100000
          test "$(wc -c < dist/assets/map-atlas/sheets/victoria-island.png)" -gt 5000
          test "$(wc -c < dist/assets/map-atlas/sheets/orbis-el-nath.png)" -gt 5000
          test -s dist/assets/map-atlas/data/markers.json
          grep -q '"world"' dist/assets/map-atlas/data/markers.json
          grep -q '"victoria"' dist/assets/map-atlas/data/markers.json
          grep -q '"ossyria"' dist/assets/map-atlas/data/markers.json
          python3 - <<'PY'
          from pathlib import Path
          s=Path('dist/index.html').read_text()
          assert s.index('data-page="quests" class="nav-btn"') < s.index('data-page="maps" class="nav-btn') < s.index('data-page="equipment" class="nav-btn')
          assert s.index('guide-data.js?v=0.8.3-static1') < s.index('etc-audit-data.js?v=0.8.3-static1') < s.index('quest-audit-additions.js?v=0.8.3-static1') < s.index('app.js?v=0.8.3-static1')
          PY

      - name: Browser gate for audited ETC and visual atlas navigation
        run: |
          cat > dist/ci-maps-etc-test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><iframe id="app" src="/"></iframe><div id="ci-result">pending</div><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms)),result=document.getElementById('ci-result'),frame=document.getElementById('app');
          frame.addEventListener('load',async()=>{try{
            const d=frame.contentDocument,w=frame.contentWindow;
            const wait=async(fn,label,n=180)=>{for(let i=0;i<n;i++){if(fn())return;await delay(250)}throw Error('timeout '+label)};
            await wait(()=>d.documentElement.classList.contains('etc-lifetime-data-ready'),'ETC data');
            await wait(()=>d.documentElement.classList.contains('quest-catalog-audit-ready'),'quest audit');
            await wait(()=>d.documentElement.classList.contains('maps-tab-ready'),'maps tab');
            await wait(()=>d.documentElement.classList.contains('maps-world-ready'),'world');
            await wait(()=>d.documentElement.classList.contains('maps-legacy-data-ready'),'legacy maps');
            const D=w.GUIDE_DATA;if(!D)throw Error('GUIDE_DATA missing');
            const item=name=>D.etc.find(x=>x.Item===name);
            const expected={"Pig's Ribbon":58,'Orange Mushroom Cap':48,'Green Mushroom Cap':98,'Leaf':121,'Octopus Leg':92,'Cursed Doll':690,'Stone Golem Rubble':173,'Tablecloth':115};
            for(const [name,keep] of Object.entries(expected)){const row=item(name);if(!row||Number(row['Permanent Keep'])!==keep||Number(row['All-In Total'])!==keep)throw Error('bad KEEP '+name);}
            const pig=item("Pig's Ribbon");if(Number(pig['Optional / Donation'])!==100||Number(pig['All-In Total'])===158)throw Error('weekly donation accounting');
            const blue=item('Blue Mushroom Cap');if(Number(blue['Crafting Need'])!==30||Number(blue['Permanent Keep'])!==115)throw Error('craft reserve');
            if(!w.TCW_QUEST_AUDIT||Number(w.TCW_QUEST_AUDIT.total)<=176)throw Error('quest catalog not expanded');

            d.querySelector('#nav .nav-btn[data-page="maps"]')?.click();
            await wait(()=>d.querySelector('section[data-page="maps"]')?.classList.contains('active'),'Maps active');
            await wait(()=>d.documentElement.classList.contains('maps-atlas-visual-ready'),'visual atlas');
            const world=d.getElementById('maps-full-world-image');
            await wait(()=>world?.complete&&world.naturalWidth>200,'Maple World artwork');
            if(d.querySelectorAll('.maps-atlas-world-point').length<10)throw Error('world WZ points');
            if(d.querySelectorAll('.maps-continent-art-image').length<8)throw Error('continent artwork');
            await wait(()=>[...d.querySelectorAll('.maps-atlas-world-point img')].some(x=>x.complete&&x.naturalWidth>0),'marker sprite');
            const state=w.TCW_MAPS?.state;if(!state||state.current.length<200||state.legacy.length<10||state.maps.length<=state.current.length)throw Error('map merge incomplete');

            d.querySelector('.maps-continent-card[data-continent="victoria"]')?.click();
            await wait(()=>d.getElementById('maps-continent')?.classList.contains('active'),'Victoria');
            await wait(()=>d.getElementById('maps-sheet-image')?.complete&&d.getElementById('maps-sheet-image').naturalWidth>200,'Victoria artwork');
            await wait(()=>d.querySelectorAll('.world-map-marker,.atlas-map-point').length>=50,'Victoria points');
            const h=[...d.querySelectorAll('.atlas-map-point')].find(x=>/Henesys/i.test(x.title||''));if(!h||h.classList.contains('unresolved')||!h.dataset.mapId)throw Error('resolved Henesys atlas point');h.click();
            await wait(()=>d.getElementById('maps-detail')?.classList.contains('active')&&/Henesys/i.test(d.getElementById('map-detail-name')?.textContent||''),'Henesys detail');
            d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(()=>d.getElementById('maps-continent')?.classList.contains('active'),'Esc to Victoria');
            d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(()=>d.getElementById('maps-world')?.classList.contains('active'),'Esc to world');

            d.querySelector('.maps-continent-card[data-continent="ossyria"]')?.click();
            await wait(()=>d.getElementById('maps-continent')?.classList.contains('active'),'Orbis El Nath');
            await wait(()=>d.getElementById('maps-sheet-image')?.complete&&d.getElementById('maps-sheet-image').naturalWidth>200,'Orbis El Nath artwork');
            await wait(()=>d.querySelectorAll('.atlas-map-point').length>=20,'Orbis El Nath WZ points');
            d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(()=>d.getElementById('maps-world')?.classList.contains('active'),'Esc from Orbis El Nath');

            d.getElementById('maps-open-explorer')?.click();await wait(()=>d.getElementById('maps-explorer')?.classList.contains('active'),'All Maps');
            const s=d.getElementById('maps-explorer-search');
            const find=async(v,r)=>{s.value=v;s.dispatchEvent(new w.Event('input',{bubbles:true}));await wait(()=>new RegExp(r,'i').test(d.getElementById('maps-explorer-list')?.textContent||''),'search '+v)};
            await find('sleepywood','Sleepywood|Ant Tunnel');
            if(d.querySelectorAll('#maps-explorer-list .maps-db-thumb').length<1)throw Error('All Maps thumbnails');
            await find('orbis','Orbis');
            const orbis=[...d.querySelectorAll('#maps-explorer-list .maps-db-row')].find(x=>/Orbis/i.test(x.textContent));if(!orbis)throw Error('Orbis result');orbis.click();
            await wait(()=>d.getElementById('maps-detail')?.classList.contains('active')&&/Orbis/i.test(d.getElementById('map-detail-name')?.textContent||''),'Orbis detail');
            await wait(()=>d.getElementById('map-detail-image')?.complete&&d.getElementById('map-detail-image').naturalWidth>0,'Orbis image');
            d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(()=>d.getElementById('maps-explorer')?.classList.contains('active'),'Esc to All Maps');
            await find('el nath','El Nath');
            result.textContent='maps-etc-regression-ok';
          }catch(e){result.textContent='maps-etc-regression-failed: '+e.message;}});
          </script></body>
          HTML
          python3 .github/ci_static_proxy.py --directory dist --port 4173 >/tmp/maps-etc-http.log 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"; test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1440,1000 --virtual-time-budget=60000 --dump-dom http://127.0.0.1:4173/ci-maps-etc-test.html >/tmp/maps-etc-test.html
          grep -o 'maps-etc-regression-[^<]*' /tmp/maps-etc-test.html || true
          grep -q '>maps-etc-regression-ok<' /tmp/maps-etc-test.html

