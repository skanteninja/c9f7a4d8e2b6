name: Monster integrity regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/monster-integrity.js'
      - 'public/monster-integrity.css'
      - 'public/monster-drop-evidence.js'
      - 'public/visuals-db.js'
      - 'public/ownership-ui.js'
      - 'public/bootstrap.js'
      - 'build.cjs'
      - '.github/workflows/monster-integrity-regression.yml'

jobs:
  monster-integrity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard Classic-only drop evidence policy
        run: |
          test -f public/monster-drop-evidence.js
          grep -q "currentClientHasDropTable: false" public/monster-drop-evidence.js
          grep -q "legacyTablesAllowedAsCurrent: false" public/monster-drop-evidence.js
          grep -q "community-documented" public/monster-drop-evidence.js
          ! grep -Eqi "v83.*(drop|rate)|legacy.*(drop|rate).*current" public/monster-drop-evidence.js
          grep -q "currentClientHasDropTable:false" public/ownership-ui.js
          grep -q "legacyTablesAllowedAsCurrent:false" public/ownership-ui.js
          grep -q "itemId:4000001" public/ownership-ui.js
          grep -q "itemId:4000002" public/ownership-ui.js
          grep -q "itemId:4000004" public/ownership-ui.js
          grep -q "monster-integrity-ready" public/ownership-ui.js
      - name: Build site
        run: |
          node build.cjs
          grep -q "monster-integrity-ready" dist/ownership-ui.js
          grep -q "legacyTablesAllowedAsCurrent:false" dist/ownership-ui.js
          grep -q "itemId:4000001" dist/ownership-ui.js
      - name: Browser shipped renderer audit
        run: |
          cat > dist/ci-monster-integrity.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body>
          <div id="app">
            <select id="db-dataset"><option value="monsters" selected>Monsters</option></select>
            <div id="db-results">
              <article class="db-card">
                <div class="db-thumb"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Snail"></div>
                <h3>Snail</h3><code>#2</code>
                <div class="visual-db-relations"><div class="visual-db-relation"><div class="visual-db-relation-head"><b>Spawn maps</b><small>37 linked</small></div></div></div>
              </article>
            </div>
          </div>
          <pre id="result">pending</pre>
          <script src="ownership-ui.js"></script>
          <script>
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const out=document.getElementById('result');
            try{
              for(let i=0;i<40&&!document.documentElement.classList.contains('monster-integrity-ready');i++)await wait(100);
              if(!document.documentElement.classList.contains('monster-drop-evidence-ready'))throw Error('drop evidence registry missing');
              if(!document.documentElement.classList.contains('monster-integrity-ready'))throw Error('integrity renderer missing');
              const card=document.querySelector('.db-card'),audit=card?.querySelector('.tcw-monster-integrity');
              if(!audit)throw Error('integrity block missing');
              if(!/37 current maps linked/i.test(audit.textContent||''))throw Error('spawn relation not consumed');
              if(!/1 Classic-specific drop/i.test(audit.textContent||''))throw Error('drop count missing');
              const chip=card.querySelector('.tcw-monster-drop-chip');
              if(!chip||!/Snail Shell/i.test(chip.textContent||''))throw Error('Snail Shell evidence missing');
              if(chip.dataset.dropItemId!=='4000001')throw Error('current Snail Shell ID mismatch');
              const src=chip.querySelector('img')?.getAttribute('src')||'';
              if(src!=='/game-data/data/current/images/items/04000001.png')throw Error('current item artwork route mismatch: '+src);
              if(window.TCW_MONSTER_DROP_EVIDENCE.currentClientHasDropTable!==false)throw Error('client drop-table policy regressed');
              if(window.TCW_MONSTER_DROP_EVIDENCE.legacyTablesAllowedAsCurrent!==false)throw Error('legacy drop policy regressed');
              if(/legacy drop table|v83 drop/i.test(chip.textContent||''))throw Error('legacy drop claim leaked');
              out.textContent='monster-integrity-regression-ok';
            }catch(e){out.textContent='monster-integrity-regression-failed: '+e.message;}
          })();
          </script></body>
          HTML
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1280,900 --virtual-time-budget=10000 --dump-dom "file://$PWD/dist/ci-monster-integrity.html" >/tmp/monster-integrity.html
          grep -o '<pre id="result">[^<]*' /tmp/monster-integrity.html || true
          grep -q '<pre id="result">monster-integrity-regression-ok</pre>' /tmp/monster-integrity.html
