name: Ownership build fix temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ownership-build-fix-temp.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep ownership detector untransformed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.cjs')
          s=p.read_text()
          old="const ownershipUi = publicScript(fs.readFileSync(path.join(source, 'ownership-ui.js'), 'utf8'));"
          new="const ownershipUi = fs.readFileSync(path.join(source, 'ownership-ui.js'), 'utf8');"
          assert old in s, 'ownership build target missing'
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/ownership-build-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.cjs
          git commit -m 'Public build: preserve ownership detector semantics'
          git push
