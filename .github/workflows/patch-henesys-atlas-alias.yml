name: Patch Henesys atlas alias

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-henesys-atlas-alias.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and browser-verify Henesys WZ resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/maps-tab.js')
          s=p.read_text()
          id_alias="  const ATLAS_CURRENT_ID_ALIASES={'100000000':'010001000'};\n"
          name_alias="  const ATLAS_CURRENT_NAME_ALIASES={'100000000':'henesys'};\n"
          if id_alias not in s: raise SystemExit('current Henesys ID alias missing')
          if name_alias not in s:s=s.replace(id_alias,id_alias+name_alias,1)
          old="if(alias){const currentAlias=state.byId.get(alias);if(currentAlias)return currentAlias;}const cur=state.byId.get(id);"
          new="if(alias){const currentAlias=state.byId.get(alias)||state.current.find(m=>padMap(m.id)===alias);if(currentAlias)return state.byRef.get(refFor(currentAlias))||currentAlias;}const aliasName=ATLAS_CURRENT_NAME_ALIASES[numeric];if(aliasName){const currentNamed=state.current.find(m=>norm(m.name)===aliasName);if(currentNamed)return state.byRef.get(refFor(currentNamed))||currentNamed;}const cur=state.byId.get(id);"
          if old not in s: raise SystemExit('current alias resolver target missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check public/maps-tab.js
          node build.cjs

          cat > dist/ci-henesys-atlas.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><iframe id="app" src="/"></iframe><div id="ci-result">pending</div><script>
          const delay=ms=>new Promise(r=>setTimeout(r,ms)),frame=document.getElementById('app'),result=document.getElementById('ci-result');
          frame.addEventListener('load',async()=>{try{const d=frame.contentDocument,w=frame.contentWindow;const wait=async(fn,label,n=180)=>{for(let i=0;i<n;i++){if(fn())return;await delay(250)}throw Error('timeout '+label)};
          await wait(()=>d.documentElement.classList.contains('maps-tab-ready'),'maps');d.querySelector('#nav .nav-btn[data-page="maps"]')?.click();
          await wait(()=>d.documentElement.classList.contains('maps-atlas-visual-ready'),'atlas');d.querySelector('.maps-continent-card[data-continent="victoria"]')?.click();
          await wait(()=>d.querySelectorAll('.atlas-map-point').length>=50,'victoria points');const h=[...d.querySelectorAll('.atlas-map-point')].find(x=>/Henesys/i.test(x.title||''));if(!h||h.classList.contains('unresolved')||!h.dataset.mapId)throw Error('Henesys unresolved');h.click();
          await wait(()=>d.getElementById('maps-detail')?.classList.contains('active')&&/Henesys/i.test(d.getElementById('map-detail-name')?.textContent||''),'Henesys detail');result.textContent='henesys-atlas-ok';}catch(e){result.textContent='henesys-atlas-failed: '+e.message;}});
          </script></body>
          HTML
          python3 .github/ci_static_proxy.py --directory dist --port 4173 >/tmp/henesys-http.log 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"; test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1440,1000 --virtual-time-budget=50000 --dump-dom http://127.0.0.1:4173/ci-henesys-atlas.html >/tmp/henesys-test.html
          grep -o 'henesys-atlas-[^<]*' /tmp/henesys-test.html || true
          grep -q '>henesys-atlas-ok<' /tmp/henesys-test.html
          rm -f dist/ci-henesys-atlas.html
          kill "$server" 2>/dev/null || true; trap - EXIT

          rm -rf site; mv dist site
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/maps-tab.js
          git add -f site
          git commit -m 'Resolve Henesys WZ point to current Classic detail'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
