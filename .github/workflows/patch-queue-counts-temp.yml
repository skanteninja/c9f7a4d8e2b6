name: Patch dashboard queue counts temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-queue-counts-temp.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch core build transform
        run: |
          echo  | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git rm .github/workflows/patch-queue-counts-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.cjs
          git commit -m 'Dashboard: expand quest and ETC queue limits'
          git push
