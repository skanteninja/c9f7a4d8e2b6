name: Public build cleanup temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-build-cleanup-temp.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden public build output
        run: |
          echo  | base64 -d > /tmp/public-build-cleanup.py
          python3 /tmp/public-build-cleanup.py
          git rm .github/workflows/public-build-cleanup-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.cjs
          git commit -m 'Public build: remove provenance and provider URLs'
          git push
