name: Trigger live atlas verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-live-atlas-verify.yml'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump permanent live gate checkpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/verify-live.yml')
          s=p.read_text()
          old='# Live gate v14: Top Classic World dashboard, audited ETC/quests and visual Maple World atlas.'
          new='# Live gate v15: Top Classic World dashboard, audited ETC/quests and visual Maple World atlas.'
          if old not in s: raise SystemExit('live gate checkpoint target missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/verify-live.yml
          git commit -m 'Run live atlas verification on current deploy'
          git push
