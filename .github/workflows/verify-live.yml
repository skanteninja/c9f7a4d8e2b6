name: Verify live site

# Live gate v9: verify compact two-card hero, merged avatar level controls, skills, and inventory-only gear progression.
on:
  workflow_run:
    workflows: ["Build static site"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live.yml'

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed static files
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          ready=0
          for i in {1..30}; do
            build_ok=0; guard_ok=0; skill_ok=0; gear_ok=0; compact_ok=0; merged_ok=0
            curl -fsSL --max-time 10 "$BASE_URL/build-info.txt?ci=$GITHUB_RUN_ID" | grep -q 'MapleStory Classic Builder 0.8.1-static1' && build_ok=1 || true
            curl -fsSL --max-time 10 "$BASE_URL/dashboard-polish.js?ci=$GITHUB_RUN_ID" | grep -q 'html.scrollWidth > html.clientWidth' && guard_ok=1 || true
            curl -fsSL --max-time 10 "$BASE_URL/progression-skill-state.js?ci=$GITHUB_RUN_ID" | grep -q 'progression-skill-state-ready' && skill_ok=1 || true
            gear_js="$(curl -fsSL --max-time 10 "$BASE_URL/progression-gear-visual.js?ci=$GITHUB_RUN_ID" || true)"
            printf '%s' "$gear_js" | grep -q 'progression-gear-visual-ready' && gear_ok=1 || true
            printf '%s' "$gear_js" | grep -q 'progression-compact-dashboard-ready' && compact_ok=1 || true
            printf '%s' "$gear_js" | grep -q 'progression-avatar-level-merged-ready' && merged_ok=1 || true
            if [ "$build_ok" -eq 1 ] && [ "$guard_ok" -eq 1 ] && [ "$skill_ok" -eq 1 ] && [ "$gear_ok" -eq 1 ] && [ "$compact_ok" -eq 1 ] && [ "$merged_ok" -eq 1 ]; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          test "$(curl -fsSL --max-time 15 "$BASE_URL/styles.css?ci=$GITHUB_RUN_ID" | wc -c)" -gt 70000
          test "$(curl -fsSL --max-time 15 "$BASE_URL/guide-data.js?ci=$GITHUB_RUN_ID" | wc -c)" -gt 250000
          test "$(curl -fsSL --max-time 15 "$BASE_URL/app.js?ci=$GITHUB_RUN_ID" | wc -c)" -gt 70000
          test "$(curl -fsSL --max-time 15 "$BASE_URL/progression-gear-visual.css?ci=$GITHUB_RUN_ID" | wc -c)" -gt 1500
          test "$(curl -fsSL --max-time 15 "$BASE_URL/progression-gear-visual.js?ci=$GITHUB_RUN_ID" | wc -c)" -gt 3000

      - name: Verify live browser boot and dashboard layout
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          for viewport in 1365,900 1024,768 800,900; do
            file="/tmp/maplestory-live-${viewport//,/-}.html"
            "$chrome" --headless --no-sandbox --disable-gpu --window-size="$viewport" --virtual-time-budget=10000 --dump-dom "$BASE_URL/?ci=$GITHUB_RUN_ID&viewport=$viewport" >"$file"
            grep -q 'class="atlas-action-row' "$file"
            grep -q 'class="gear-slot' "$file"
            grep -q 'class="atlas-timeline-level' "$file"
            grep -q 'class="progression-avatar-level-controls' "$file"
            grep -q 'id="level-range"' "$file"
            grep -q 'id="hero-level-select"' "$file"
            for marker in dashboard-polish-ready progression-sync-ready progression-level-hook-ready progression-skill-state-ready progression-gear-visual-ready progression-compact-dashboard-ready progression-avatar-level-merged-ready progression-gear-decision-verified dashboard-action-layout-ok dashboard-page-layout-ok; do
              grep -q "$marker" "$file"
            done
            ! grep -q 'class="progression-loadout-strip' "$file"
            ! grep -q 'class="avatar-equipped-icons' "$file"
            ! grep -q 'class="v5-level-hero' "$file"
            ! grep -q 'dashboard-overflow-detected' "$file"
            ! grep -q 'dashboard-page-overflow-detected' "$file"
          done
