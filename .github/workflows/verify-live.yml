name: Verify live site

# Live gate v21: product, visual atlas, same-origin Classic media, monster integrity, and zero-reload dashboard skill icons.
on:
  workflow_run:
    workflows: ["Build static site"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live.yml'

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed product and visual map atlas
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          ready=0
          for i in {1..60}; do
            build_ok=0; maps_ok=0; classic_ok=0; atlas_ok=0; visuals_ok=0; integrity_ok=0; stability_ok=0
            build_info="$(curl -fsSL --max-time 12 "$BASE_URL/build-info.txt?ci=$GITHUB_RUN_ID" || true)"
            [[ "$build_info" == *"Top Classic World Maplestory 0.8.9-multibuild-foundation"* ]] && build_ok=1 || true

            maps_js="$(curl -fsSL --max-time 15 "$BASE_URL/maps-tab.js?ci=$GITHUB_RUN_ID" || true)"
            if [[ "$maps_js" == *"maps-world-ready"* ]] && [[ "$maps_js" == *"maps-explorer-ready"* ]] && [[ "$maps_js" == *"maps-atlas-visual-ready"* ]] && [[ "$maps_js" == *"ATLAS_CURRENT_NAME_ALIASES"* ]] && [[ "$maps_js" == *"100000000':'henesys"* ]] && [[ "$maps_js" == *"legacyFetch=Promise.resolve([])"* ]]; then maps_ok=1; fi

            classic_manifest="$(curl -fsSL --max-time 35 "$BASE_URL/game-data/data/current/map_manifest.json?ci=$GITHUB_RUN_ID" || true)"
            if [ "${#classic_manifest}" -gt 10000 ] && [[ "$classic_manifest" == *'010000000'* ]] && [[ "$classic_manifest" == *'020000000'* ]]; then classic_ok=1; fi

            world_bytes="$(curl -fsSL --max-time 30 "$BASE_URL/assets/map-atlas/sheets/maple-world.png?ci=$GITHUB_RUN_ID" 2>/dev/null | wc -c || true)"
            atlas_data="$(curl -fsSL --max-time 20 "$BASE_URL/assets/map-atlas/data/markers.json?ci=$GITHUB_RUN_ID" || true)"
            if [ "${world_bytes:-0}" -gt 100000 ] && [ "${#atlas_data}" -gt 1000 ] && [[ "$atlas_data" == *'"world"'* ]] && [[ "$atlas_data" == *'"victoria"'* ]] && [[ "$atlas_data" == *'"ossyria"'* ]]; then atlas_ok=1; fi

            visuals_js="$(curl -fsSL --max-time 15 "$BASE_URL/visuals.js?ci=$GITHUB_RUN_ID" || true)"
            monster_bytes="$(curl -fsSL --max-time 20 "$BASE_URL/game-data/data/images/monsters/03b8bda63a91a4f5c89dae6f6983caf0.webp?ci=$GITHUB_RUN_ID" 2>/dev/null | wc -c || true)"
            raw_path_ok=0
            if [[ "$visuals_js" == *"const RAW = '/game-data/data/current/';"* ]] || [[ "$visuals_js" == *'const RAW = `${REPO_RAW}data/current/`;'* ]]; then raw_path_ok=1; fi
            if [[ "$visuals_js" == *"const REPO_RAW = '/game-data/';"* ]] && [ "$raw_path_ok" -eq 1 ] && [[ "$visuals_js" != *"raw.githubusercontent.com/ohmi69/osms_datamine_dashboard"* ]] && [ "${monster_bytes:-0}" -gt 500 ]; then visuals_ok=1; fi

            ownership_js="$(curl -fsSL --max-time 15 "$BASE_URL/ownership-ui.js?ci=$GITHUB_RUN_ID" || true)"
            if [[ "$ownership_js" == *"version:'2026-09-05.4'"* ]] && [[ "$ownership_js" == *"itemId:4000001"* ]] && [[ "$ownership_js" == *"legacyTablesAllowedAsCurrent:false"* ]] && [[ "$ownership_js" == *"monster-integrity-ready"* ]]; then integrity_ok=1; fi

            level_hook="$(curl -fsSL --max-time 15 "$BASE_URL/progression-level-hook.js?ci=$GITHUB_RUN_ID" || true)"
            sync_css="$(curl -fsSL --max-time 15 "$BASE_URL/progression-sync.css?ci=$GITHUB_RUN_ID" || true)"
            if [[ "$level_hook" == *"tcw-skill-images-connected-ready"* ]] && [[ "$level_hook" != *"node.remove()"* ]] && [[ "$sync_css" == *"Dashboard skill artwork never fades"* ]] && [[ "$sync_css" == *"filter:none!important;opacity:1!important"* ]]; then stability_ok=1; fi

            echo "live-check[$i] build=$build_ok maps=$maps_ok classic=$classic_ok atlas=$atlas_ok visuals=$visuals_ok integrity=$integrity_ok stability=$stability_ok world_bytes=${world_bytes:-0} monster_bytes=${monster_bytes:-0}"
            if [ "$build_ok" -eq 1 ] && [ "$maps_ok" -eq 1 ] && [ "$classic_ok" -eq 1 ] && [ "$atlas_ok" -eq 1 ] && [ "$visuals_ok" -eq 1 ] && [ "$integrity_ok" -eq 1 ] && [ "$stability_ok" -eq 1 ]; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1
          test "$(curl -fsSL --max-time 15 "$BASE_URL/maps-tab.css?ci=$GITHUB_RUN_ID" | wc -c)" -gt 4000
          test "$(curl -fsSL --max-time 15 "$BASE_URL/etc-audit-data.js?ci=$GITHUB_RUN_ID" | wc -c)" -gt 5000
          test "$(curl -fsSL --max-time 15 "$BASE_URL/quest-audit-additions.js?ci=$GITHUB_RUN_ID" | wc -c)" -gt 5000
          app_js="$(curl -fsSL --max-time 15 "$BASE_URL/app.js?ci=$GITHUB_RUN_ID")"
          visuals_db_js="$(curl -fsSL --max-time 15 "$BASE_URL/visuals-db.js?ci=$GITHUB_RUN_ID")"
          visuals_npc_js="$(curl -fsSL --max-time 15 "$BASE_URL/visuals-npc.js?ci=$GITHUB_RUN_ID")"
          [[ "$app_js" != *"raw.githubusercontent.com/ohmi69/osms_datamine_dashboard"* ]]
          [[ "$visuals_db_js" != *"raw.githubusercontent.com/ohmi69/osms_datamine_dashboard"* ]]
          [[ "$visuals_npc_js" != *"raw.githubusercontent.com/ohmi69/osms_datamine_dashboard"* ]]

      - name: Verify live browser dashboard and visual Maple World atlas
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          for viewport in 1365,900 1024,768 800,900; do
            file="/tmp/maplestory-live-${viewport//,/-}.html"
            "$chrome" --headless --no-sandbox --disable-gpu --window-size="$viewport" --virtual-time-budget=36000 --dump-dom "$BASE_URL/?ci=$GITHUB_RUN_ID&viewport=$viewport" >"$file"
            for marker in dashboard-polish-ready progression-sync-ready progression-level-hook-ready progression-skill-state-ready progression-gear-visual-ready progression-compact-dashboard-ready progression-avatar-level-merged-ready progression-gear-decision-verified dashboard-action-layout-ok dashboard-page-layout-ok top-classic-world-ready public-source-clean-ready dashboard-queues-after-hero-ready dashboard-avatar-level-footer-ready owned-image-urls-ready maps-nav-ready maps-data-ready maps-tab-ready maps-world-ready maps-atlas-visual-ready etc-lifetime-data-ready quest-catalog-audit-ready etc-lifetime-audit-ready monster-drop-evidence-ready tcw-skill-images-connected-ready; do
              if ! grep -q "$marker" "$file"; then
                echo "missing live marker: $marker (viewport $viewport)"
                grep -o 'class="[^"]*ready[^"]*"' "$file" | head -c 2000 || true
                exit 1
              fi
            done
            required_patterns=(
              '<title>Top Classic World Maplestory</title>'
              'data-page="maps" class="nav-btn'
              'id="maps-world"'
              'id="maps-open-explorer"'
              'data-continent="victoria"'
              'data-continent="ossyria"'
              'data-continent="maple-island"'
              'id="maps-full-world-image"'
              'maps-atlas-world-point'
              'maps-continent-art-image'
              'id="level-range"'
              'id="atlas-quest-queue"'
              'id="atlas-etc-queue"'
            )
            for required in "${required_patterns[@]}"; do
              if ! grep -q "$required" "$file"; then
                echo "missing live browser assertion: $required (viewport $viewport)"
                grep -o 'id="[^"]*"' "$file" | head -80 || true
                exit 1
              fi
            done
            for forbidden in dashboard-overflow-detected dashboard-page-overflow-detected; do
              if grep -q "$forbidden" "$file"; then
                echo "forbidden dashboard overflow marker: $forbidden (viewport $viewport)"
                exit 1
              fi
            done
            if grep -Eqi '>\s*(PLAY|DATABASE|META)\s*<' "$file"; then
              echo "forbidden navigation label exposed"
              grep -Eio '>\s*(PLAY|DATABASE|META)\s*<' "$file" | head -20 || true
              exit 1
            fi
            if grep -Eqi 'COT2|OSMS|pre[- ]launch|launch[- ]scope|Evidence &amp; sources|Evidence & sources' "$file"; then
              echo "forbidden internal wording exposed"
              grep -Ein -C 1 'COT2|OSMS|pre[- ]launch|launch[- ]scope|Evidence &amp; sources|Evidence & sources' "$file" | head -60 || true
              exit 1
            fi
            python3 - "$file" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          imgs=re.findall(r'<img\b[^>]*\bsrc="([^"]+)"',s,re.I)
          bad=[x for x in imgs if x.startswith(('http://','https://'))]
          assert not bad, f'third-party rendered image URLs: {bad[:8]}'
          assert 'data-page="formulas" class="nav-btn' not in s
          assert 'data-page="research" class="nav-btn' not in s
          assert 'data-page="data" class="nav-btn' not in s
          assert s.index('data-page="quests" class="nav-btn') < s.index('data-page="maps" class="nav-btn') < s.index('data-page="equipment" class="nav-btn')
          cards=len(re.findall(r'class="maps-continent-card',s))
          points=len(re.findall(r'class="maps-atlas-world-point',s))
          print(f"live-map-dom cards={cards} points={points} images={len(imgs)}")
          assert cards > 0, f"no rendered continent cards (cards={cards}, points={points})"
          assert points >= cards, f"world atlas points do not cover cards (cards={cards}, points={points})"
          PY
          done

      - name: Verify live skill icons never reload on same-tier levels
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m pip install --quiet websocket-client
          rm -rf /tmp/tcw-live-cdp
          "$chrome" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/tcw-live-cdp "$BASE_URL/?ci=$GITHUB_RUN_ID&skill-stability=1" >/tmp/tcw-live-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            curl -fsS http://127.0.0.1:9222/json >/tmp/tcw-cdp-tabs.json 2>/dev/null && break
            sleep .1
          done
          test -s /tmp/tcw-cdp-tabs.json
          python3 - <<'PY'
          import json, os, time, urllib.request
          import websocket

          tabs=json.load(open('/tmp/tcw-cdp-tabs.json',encoding='utf-8'))
          page=next((x for x in tabs if x.get('type')=='page' and 'maplestory-classic.ofri505.workers.dev' in x.get('url','')),None)
          if not page:
              raise SystemExit('live page CDP target missing')
          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=20)
          seq=0

          def send(method,params=None):
              global seq
              seq+=1
              ident=seq
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==ident:
                      if 'error' in msg:
                          raise RuntimeError(f"CDP {method}: {msg['error']}")
                      return msg.get('result',{})

          def ev(expr, await_promise=True):
              out=send('Runtime.evaluate',{
                  'expression':expr,
                  'awaitPromise':await_promise,
                  'returnByValue':True,
                  'userGesture':True
              })
              if out.get('exceptionDetails'):
                  raise RuntimeError(out['exceptionDetails'].get('text','evaluation failed'))
              return out.get('result',{}).get('value')

          send('Runtime.enable')
          ready=ev("""new Promise((resolve,reject)=>{let n=0;const t=setInterval(()=>{n++;const d=document.documentElement;const ok=d.classList.contains('tcw-skill-images-connected-ready')&&d.classList.contains('dashboard-skill-in-hero-ready')&&document.getElementById('level-select')&&document.querySelector('.dashboard-v72 .tcw-hero-skill-tree');if(ok){clearInterval(t);resolve(true)}else if(n>160){clearInterval(t);reject(new Error('live dashboard not ready'))}},100)})""")
          assert ready is True

          ev("""window.__tcwSetLevel=async n=>{const sel=document.getElementById('level-select');sel.value=String(n);sel.dispatchEvent(new Event('change',{bubbles:true}));await new Promise(r=>setTimeout(r,1100));if(String(document.getElementById('hero-level')?.textContent)!==String(n))throw new Error('level '+n+' did not sync');return true}""")

          assert ev("window.__tcwSetLevel(10)") is True
          magic_ready=ev("""new Promise((resolve,reject)=>{let n=0;const t=setInterval(()=>{n++;const img=document.querySelector('#atlas-skill-grid [data-skill-name="Magic Claw"] img');if(img?.dataset.skillId==='2001003'&&img.complete&&img.naturalWidth>0){clearInterval(t);resolve(true)}else if(n>80){clearInterval(t);reject(new Error('canonical Magic Claw not ready'))}},100)})""")
          assert magic_ready is True
          baseline=ev("""(()=>{window.__mcPanel=document.querySelector('.dashboard-v72 .tcw-hero-skill-tree');window.__mcCard=document.querySelector('#atlas-skill-grid [data-skill-name="Magic Claw"]');window.__mcImg=window.__mcCard?.querySelector('img');window.__mcSrc=window.__mcImg?.getAttribute('src')||'';window.__mcLoads=0;window.__mcImg?.addEventListener('load',()=>window.__mcLoads++);const cs=getComputedStyle(window.__mcImg);return {id:window.__mcImg?.dataset.skillId,src:window.__mcSrc,filter:cs.filter,opacity:cs.opacity,complete:window.__mcImg?.complete,naturalWidth:window.__mcImg?.naturalWidth}})()""")
          assert baseline['id']=='2001003', baseline
          assert baseline['src'], baseline
          assert baseline['filter']=='none', baseline
          assert baseline['opacity']=='1', baseline
          assert baseline['complete'] and baseline['naturalWidth']>0, baseline

          assert ev("window.__tcwSetLevel(11)") is True
          magic_after=ev("""(()=>{const card=document.querySelector('#atlas-skill-grid [data-skill-name="Magic Claw"]');const img=card?.querySelector('img');const cs=getComputedStyle(img);return {samePanel:document.querySelector('.dashboard-v72 .tcw-hero-skill-tree')===window.__mcPanel,sameCard:card===window.__mcCard,sameImg:img===window.__mcImg,sameSrc:(img?.getAttribute('src')||'')===window.__mcSrc,loads:window.__mcLoads,id:img?.dataset.skillId,filter:cs.filter,opacity:cs.opacity}})()""")
          assert all(magic_after[k] for k in ['samePanel','sameCard','sameImg','sameSrc']), magic_after
          assert magic_after['loads']==0, magic_after
          assert magic_after['id']=='2001003', magic_after
          assert magic_after['filter']=='none' and magic_after['opacity']=='1', magic_after

          assert ev("window.__tcwSetLevel(15)") is True
          stable_count=ev("""(()=>{window.__stablePanel=document.querySelector('.dashboard-v72 .tcw-hero-skill-tree');window.__stableGrid=document.getElementById('atlas-skill-grid');window.__stableSkills={};for(const card of window.__stableGrid.querySelectorAll('.atlas-skill-card[data-skill-name]')){const name=card.dataset.skillName,img=card.querySelector('img');const entry={card,img,src:img?.getAttribute('src')||'',loads:0};img?.addEventListener('load',()=>entry.loads++);window.__stableSkills[name]=entry}window.__gridChildMutations=0;window.__gridObserver=new MutationObserver(rs=>window.__gridChildMutations+=rs.filter(r=>r.type==='childList').length);window.__gridObserver.observe(window.__stableGrid,{childList:true,subtree:false});return Object.keys(window.__stableSkills).length})()""")
          assert stable_count==6, stable_count
          decoded=ev("""Object.values(window.__stableSkills).every(x=>x.img&&x.img.complete&&x.img.naturalWidth>0&&getComputedStyle(x.img).filter==='none'&&getComputedStyle(x.img).opacity==='1')""")
          assert decoded is True

          for lvl in (16,17):
              assert ev(f"window.__tcwSetLevel({lvl})") is True
              status=ev("""(()=>{const out={samePanel:document.querySelector('.dashboard-v72 .tcw-hero-skill-tree')===window.__stablePanel,sameGrid:document.getElementById('atlas-skill-grid')===window.__stableGrid,skills:{}};for(const [name,before] of Object.entries(window.__stableSkills)){const card=[...window.__stableGrid.querySelectorAll('.atlas-skill-card[data-skill-name]')].find(x=>x.dataset.skillName===name),img=card?.querySelector('img'),cs=getComputedStyle(img);out.skills[name]={sameCard:card===before.card,sameImg:img===before.img,sameSrc:(img?.getAttribute('src')||'')===before.src,loads:before.loads,filter:cs.filter,opacity:cs.opacity}}return out})()""")
              assert status['samePanel'] and status['sameGrid'], status
              for name,s in status['skills'].items():
                  assert s['sameCard'] and s['sameImg'] and s['sameSrc'], (lvl,name,s)
                  assert s['loads']==0, (lvl,name,s)
                  assert s['filter']=='none' and s['opacity']=='1', (lvl,name,s)

          grid_mutations=ev("window.__gridObserver.disconnect();window.__gridChildMutations")
          assert grid_mutations==0, f'live skill grid rebuilt {grid_mutations} times'
          magic_count=ev("document.querySelectorAll('#atlas-skill-grid [data-skill-name=\"Magic Claw\"] img[data-skill-id=\"2001003\"]').length")
          assert magic_count==1, f'expected one canonical Magic Claw icon, got {magic_count}'
          print('live-skill-icon-stability-ok')
          ws.close()
          PY

      - name: Verify live multi-build library and direct build routes
        env:
          BASE_URL: https://maplestory-classic.ofri505.workers.dev
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          dump_build() {
            local build="$1"
            local page="$2"
            local output="$3"
            "$chrome" --headless --no-sandbox --disable-gpu --window-size=1365,900 --virtual-time-budget=30000 --dump-dom "$BASE_URL/?ci=$GITHUB_RUN_ID&build=$build&page=$page" >"$output"
          }

          dump_build magician-il-fresh builds /tmp/tcw-live-build-library.html
          dump_build warrior-fighter dashboard /tmp/tcw-live-fighter.html
          dump_build archer-hunter dashboard /tmp/tcw-live-hunter.html
          dump_build magician-il-fresh dashboard /tmp/tcw-live-il.html

          python3 - <<'PY'
          from pathlib import Path

          library = Path('/tmp/tcw-live-build-library.html').read_text(encoding='utf-8', errors='replace')
          for name in ('Fighter Build', 'Hunter Build', 'I/L Wizard Build'):
              assert name in library, f'missing build-library card: {name}'
          for build_id in ('warrior-fighter', 'archer-hunter', 'magician-il-fresh'):
              assert f'data-build-select="{build_id}"' in library, f'missing build link: {build_id}'
          assert 'Luna' not in library, 'engine name leaked into build-library copy'

          checks = [
              ('/tmp/tcw-live-fighter.html', 'Fighter Build', 'WARRIOR', 'FIGHTER'),
              ('/tmp/tcw-live-hunter.html', 'Hunter Build', 'BOWMAN', 'HUNTER'),
              ('/tmp/tcw-live-il.html', 'I/L Wizard Build', 'MAGICIAN', 'WIZARD'),
          ]
          for filename, title, class_name, job_name in checks:
              html = Path(filename).read_text(encoding='utf-8', errors='replace')
              assert f'id="hero-build-title">{title}</h2>' in html, f'wrong title in {filename}'
              assert f'class-pill">{class_name}</span>' in html, f'wrong class emblem in {filename}'
              assert f'job-pill">{job_name}' in html, f'wrong advancement in {filename}'
          assert 'data-skill-name="Power Strike"' in Path('/tmp/tcw-live-fighter.html').read_text(encoding='utf-8', errors='replace')
          assert 'data-skill-name="Arrow Blow"' in Path('/tmp/tcw-live-hunter.html').read_text(encoding='utf-8', errors='replace')
          assert 'data-skill-name="Magic Claw"' in Path('/tmp/tcw-live-il.html').read_text(encoding='utf-8', errors='replace')
          print('live-multibuild-library-ok')
          PY
