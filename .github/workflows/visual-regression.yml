name: Visual and UI regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'build.cjs'
      - '.github/workflows/visual-regression.yml'

jobs:
  visual-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build test site
        run: node build.cjs
      - name: Browser UI and asset audit
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/maplestory-visual-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .25
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"

          cat > dist/ci-visual-regression.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><iframe id="app" src="/"></iframe><pre id="result">pending</pre><script>
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const frame=document.getElementById('app');
          frame.addEventListener('load',async()=>{
            const out=document.getElementById('result');
            try{
              const w=frame.contentWindow,d=frame.contentDocument;
              for(let i=0;i<50&&!d.documentElement.classList.contains('progression-level-footer-ready');i++)await wait(120);
              const required=['navigation-cleanup-ready','visual-asset-audit-ready','dashboard-skill-immediate-ready','progression-level-footer-ready'];
              for(const cls of required){if(!d.documentElement.classList.contains(cls))throw Error('missing '+cls);}

              const labels=[...d.querySelectorAll('#nav .nav-section-label')].map(x=>x.textContent.trim().toUpperCase());
              if(labels.includes('PLAY'))throw Error('PLAY label still visible');
              if(labels.includes('DATABASE'))throw Error('DATABASE label still visible');
              if(d.querySelector('#nav .nav-btn[data-page="formulas"]'))throw Error('Formula nav still visible');
              const db=d.querySelector('#nav .nav-btn[data-page="classicdb"]');
              if(!db||db.textContent.trim()!=='⌘ Database')throw Error('Database nav copy incorrect: '+(db?.textContent||'missing'));

              const character=d.querySelector('.dashboard-v72 .v5-character-hero');
              const avatar=character?.querySelector('.v5-avatar');
              const copy=character?.querySelector('.v5-character-copy');
              const controls=character?.querySelector(':scope > .progression-avatar-level-controls');
              if(!character||!avatar||!copy||!controls)throw Error('character progression structure missing');
              const cr=controls.getBoundingClientRect(), ar=avatar.getBoundingClientRect(), xr=copy.getBoundingClientRect();
              if(cr.top < Math.max(ar.bottom,xr.bottom)-3)throw Error('level controls are not below full character content');
              if(!controls.contains(d.getElementById('level-range'))||!controls.contains(d.getElementById('hero-level-select')))throw Error('level controls lost real inputs');

              if(d.querySelector('#atlas-skill-grid .beginner-milestone-grid'))throw Error('Beginner milestone placeholder still visible');
              if(d.querySelectorAll('#atlas-skill-grid .beginner-skill-card').length!==3)throw Error('Beginner skill cards not stable');

              d.querySelector('#nav .nav-btn[data-page="cashshop"]')?.click();
              await wait(2200);
              const cash=d.getElementById('cash-results');
              const unavailable=[...(cash?.querySelectorAll('.cash-card.cash-unavailable')||[])];
              if(!unavailable.length)throw Error('Cash Shop unavailable styling missing');
              if(/\b0\s*NX\b/i.test(cash?.innerText||''))throw Error('Cash Shop still displays 0 NX');
              if(unavailable.some(card=>!/UNAVAILABLE/i.test(card.querySelector('.cash-meta b')?.textContent||'')))throw Error('Unavailable Cash Shop price copy missing');

              const pages=['dashboard','leveling','quests','equipment','skills','etc','classicdb','cashshop','beauty'];
              const broken=[];
              for(const page of pages){
                d.querySelector(`#nav .nav-btn[data-page="${page}"]`)?.click();
                await wait(page==='classicdb'||page==='cashshop'||page==='beauty'?1500:550);
                d.querySelectorAll('img').forEach(img=>img.loading='eager');
                w.scrollTo(0,d.body.scrollHeight);
                await wait(650);
                const root=d.querySelector(`section[data-page="${page}"]`);
                [...(root?.querySelectorAll('img')||[])].forEach(img=>{
                  if(img.complete&&img.naturalWidth===0&&img.getAttribute('src'))broken.push(`${page}: ${img.alt||'(no alt)'} -> ${img.getAttribute('src')}`);
                });
                w.scrollTo(0,0);
              }
              if(broken.length)throw Error('broken images: '+broken.slice(0,12).join(' | '));
              out.textContent='visual-ui-regression-ok';
            }catch(e){out.textContent='visual-ui-regression-failed: '+e.message;}
          });
          </script></body>
          HTML

          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1440,1000 --virtual-time-budget=30000 --dump-dom http://127.0.0.1:4173/ci-visual-regression.html >/tmp/visual-regression.html
          grep -o 'visual-ui-regression-[^<]*' /tmp/visual-regression.html || true
          grep -q '>visual-ui-regression-ok<' /tmp/visual-regression.html
          ! grep -q 'visual-ui-regression-failed' /tmp/visual-regression.html
