name: Visual and UI regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'build.cjs'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/ci_static_proxy.py'
      - '.github/workflows/visual-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'build.cjs'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/ci_static_proxy.py'
      - '.github/workflows/visual-regression.yml'

jobs:
  visual-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build test site
        run: node build.cjs
      - name: Browser UI, ownership and asset audit
        run: |
          python3 .github/ci_static_proxy.py --directory dist --port 4173 >/tmp/maplestory-visual-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .25
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"

          cat > dist/ci-visual-regression.html <<'HTML'
          <!doctype html><meta charset="utf-8"><style>html,body{width:100%;height:100%;margin:0;overflow:hidden}#app{display:block;width:100%;height:100%;border:0}#result{position:fixed;left:0;bottom:0;z-index:99;margin:0}</style><body><iframe id="app" src="/"></iframe><pre id="result">pending</pre><script>
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const frame=document.getElementById('app');
          frame.addEventListener('load',async()=>{
            const out=document.getElementById('result');
            try{
              const w=frame.contentWindow,d=frame.contentDocument;
              for(let i=0;i<70&&!d.documentElement.classList.contains('dashboard-avatar-level-footer-ready');i++)await wait(120);
              const required=['navigation-cleanup-ready','visual-asset-audit-ready','dashboard-skill-immediate-ready','dashboard-queues-after-hero-ready','dashboard-avatar-level-footer-ready','top-classic-world-ready','public-source-clean-ready','owned-image-urls-ready','progression-level-scale-correct-ready','dashboard-queues-readable-ready'];
              for(const cls of required){if(!d.documentElement.classList.contains(cls))throw Error('missing '+cls);}

              if(d.title!=='Top Classic World Maplestory')throw Error('brand title incorrect');
              const labels=[...d.querySelectorAll('#nav .nav-section-label')].map(x=>x.textContent.trim().toUpperCase());
              if(labels.some(x=>['PLAY','DATABASE','META'].includes(x)))throw Error('obsolete nav section label visible');
              for(const page of ['formulas','research','data'])if(d.querySelector(`#nav .nav-btn[data-page="${page}"]`))throw Error(page+' nav still visible');
              const db=d.querySelector('#nav .nav-btn[data-page="classicdb"]');
              if(!db||db.textContent.trim()!=='⌘ Database')throw Error('Database nav copy incorrect: '+(db?.textContent||'missing'));

              const dashboard=d.querySelector('.dashboard-v72');
              const hero=dashboard?.querySelector('.v72-hero-grid');
              const commands=dashboard?.querySelector('.v72-command-grid');
              const character=dashboard?.querySelector('.v5-character-hero');
              const controls=character?.querySelector(':scope > .progression-avatar-level-controls');
              if(!dashboard||!hero||!commands||!character||!controls)throw Error('dashboard avatar level footer hierarchy missing');
              if(hero.nextElementSibling!==commands)throw Error('action queues are not directly below hero cards');
              if(getComputedStyle(controls).display==='none')throw Error('avatar level footer is hidden');
              if(!controls.contains(d.getElementById('level-range')))throw Error('avatar level line missing');
              if(!controls.contains(d.getElementById('hero-level-select')))throw Error('avatar level selector missing');
              if(d.querySelector('.v5-level-hero,.v72-level-hero'))throw Error('standalone level card returned');
              const level=d.getElementById('level-select');
              if(!level)throw Error('topbar level control missing');
              const option=level.options[Math.min(25,Math.max(0,level.options.length-1))];
              const optionStyle=option?getComputedStyle(option):null;
              if(!optionStyle)throw Error('level dropdown option missing');
              const optionColor=optionStyle.color.replace(/\s+/g,'');
              if(optionColor==='rgb(17,17,17)'||optionColor==='rgb(0,0,0)')throw Error('level dropdown option text is dark on dark UI: '+optionColor);
              if(getComputedStyle(level).colorScheme!=='dark')throw Error('level dropdown is not using dark native controls');
              const panels=[...commands.children].filter(x=>x.classList.contains('panel'));
              if(panels.length!==3)throw Error('expected three action queue cards');
              const heights=panels.map(x=>Math.round(x.getBoundingClientRect().height));
              if(Math.max(...heights)-Math.min(...heights)>3)throw Error('queue card heights differ: '+heights.join(','));

              if(d.querySelector('#atlas-skill-grid .beginner-milestone-grid'))throw Error('Beginner milestone placeholder still visible');
              if(d.querySelectorAll('#atlas-skill-grid .beginner-skill-card').length!==3)throw Error('Beginner skill cards not stable');

              level.value='44';level.dispatchEvent(new w.Event('change',{bubbles:true}));
              await wait(1900);
              const controlsAfter=dashboard.querySelector('.v5-character-hero > .progression-avatar-level-controls');
              if(!controlsAfter||getComputedStyle(controlsAfter).display==='none')throw Error('avatar level footer lost after level change');
              if(String(d.getElementById('hero-level')?.textContent)!=='44')throw Error('avatar level footer did not sync to 44');
              if(String(d.getElementById('level-range')?.value)!=='44')throw Error('level range did not sync to 44');
              const track=controlsAfter.querySelector('.progression-level-track');
              const readout=track?.querySelector('.progression-level-slider-value');
              if(!track||String(readout?.textContent||'').trim()!=='LV 44')throw Error('exact LV 44 slider marker missing');
              const milestones=[...(track.querySelector('.v5-milestones')?.children||[])];
              if(milestones.length!==4)throw Error('level milestones missing');
              const tr=track.getBoundingClientRect(),m30=milestones[2].getBoundingClientRect(),rr=readout.getBoundingClientRect();
              const m30pct=((m30.left+m30.width/2)-tr.left)/tr.width;
              const readpct=((rr.left+rr.width/2)-tr.left)/tr.width;
              if(Math.abs(m30pct-(29/69))>.035)throw Error('Lv30 milestone is not on the true numeric scale: '+m30pct.toFixed(3));
              if(Math.abs(readpct-(43/69))>.045)throw Error('Lv44 marker is not on the true numeric scale: '+readpct.toFixed(3));
              if(!(readpct>m30pct+.12))throw Error('Lv44 still visually overlaps the Lv30 milestone');

              const questRows=[...d.querySelectorAll('#atlas-quest-queue .atlas-queue-row')];
              const etcRows=[...d.querySelectorAll('#atlas-etc-queue .v72-etc-chip')];
              if(questRows.length<5)throw Error('Quest Queue still capped at four rows');
              if(etcRows.length<7)throw Error('ETC Queue still capped at six targets');
              const qName=questRows.find(x=>x.querySelector('b'))?.querySelector('b');
              const qMeta=questRows.find(x=>x.querySelector('small'))?.querySelector('small');
              const etcName=etcRows.find(x=>x.querySelector('.tcw-etc-name'))?.querySelector('.tcw-etc-name');
              const etcQty=etcRows.find(x=>x.querySelector(':scope > b'))?.querySelector(':scope > b');
              if(!qName||parseFloat(getComputedStyle(qName).fontSize)<11)throw Error('Quest primary text is too small');
              if(!qMeta||parseFloat(getComputedStyle(qMeta).fontSize)<9)throw Error('Quest secondary text is too small');
              if(!etcName||parseFloat(getComputedStyle(etcName).fontSize)<10)throw Error('ETC item names are missing or too small');
              if(!etcQty||parseFloat(getComputedStyle(etcQty).fontSize)<11)throw Error('ETC target text is too small');
              const qScroll=d.getElementById('atlas-quest-queue'),eScroll=d.getElementById('atlas-etc-queue');
              if(qScroll.scrollHeight<=qScroll.clientHeight)throw Error('Quest Queue is not using internal scroll for extra rows');
              if(eScroll.scrollHeight<=eScroll.clientHeight)throw Error('ETC Queue is not using internal scroll for extra rows');

              d.querySelector('#nav .nav-btn[data-page="skills"]')?.click();
              for(let i=0;i<35&&!d.documentElement.classList.contains('canonical-skill-icons-ready');i++)await wait(120);
              await wait(700);
              if(!d.documentElement.classList.contains('skill-tree-informational-ready'))throw Error('Skill Tree informational mode missing');
              if(!d.documentElement.classList.contains('full-skill-beginner-ready'))throw Error('full Beginner skill section missing');
              if(!d.documentElement.classList.contains('canonical-skill-icons-ready'))throw Error('canonical skill icon resolver missing');
              const skillList=d.getElementById('skill-list');
              if(!skillList)throw Error('Skill Tree list missing');
              if(skillList.querySelector('input[type="checkbox"],.skill-check'))throw Error('Skill Tree still contains completion checkboxes');
              if([...skillList.querySelectorAll('.skill-row')].some(r=>r.classList.contains('done')))throw Error('Skill Tree still has completion-state styling');
              const beginnerCards=[...skillList.querySelectorAll('.skill-beginner-card')];
              if(beginnerCards.length!==3)throw Error('expected exactly three full-page Beginner skills, got '+beginnerCards.length);
              const beginnerNames=beginnerCards.map(x=>x.dataset.fullSkillName).sort().join('|');
              if(beginnerNames!==['Nimble Feet','Recovery','Three Snails'].sort().join('|'))throw Error('Beginner skill names incorrect: '+beginnerNames);
              if(beginnerCards.some(x=>!x.querySelector('img.canonical-skill-icon')))throw Error('Beginner skill canonical icon missing');

              const skillIcons=[...skillList.querySelectorAll('img.canonical-skill-icon')];
              if(!skillIcons.length)throw Error('no canonical Skill Tree icons rendered');
              const iconFor=name=>skillIcons.find(im=>String(im.dataset.skillName||'')===name);
              const magicGuardIcon=iconFor('Magic Guard');
              const maxMpIcon=iconFor('Max MP Increase');
              if(!magicGuardIcon||magicGuardIcon.dataset.skillId!=='2001000')throw Error('Magic Guard did not resolve to current Classic skill 2001000');
              if(!maxMpIcon||maxMpIcon.dataset.skillId!=='2000001')throw Error('Max MP Increase did not resolve to current Classic skill 2000001');
              if(!/\/game-data\/data\/current\/images\/skills\/2001000\.png$/.test(magicGuardIcon.getAttribute('src')||''))throw Error('Magic Guard primary icon is not current Classic artwork: '+magicGuardIcon.getAttribute('src'));
              if(!/\/game-data\/data\/current\/images\/skills\/2000001\.png$/.test(maxMpIcon.getAttribute('src')||''))throw Error('Max MP Increase primary icon is not current Classic artwork: '+maxMpIcon.getAttribute('src'));
              if(!/\/game-media\/skills\//.test(magicGuardIcon.dataset.assetFallbacks||''))throw Error('Magic Guard name-matched WZ fallback missing');
              for(const im of skillIcons){
                const id=String(im.dataset.skillId||'');
                if(!id)throw Error('canonical Skill Tree icon missing skill ID: '+(im.alt||'unknown'));
                if(im.dataset.skillIconPolicy!=='current-classic-first-name-matched-wz-fallback')throw Error('inconsistent skill icon policy: '+(im.alt||id));
                const src=im.getAttribute('src')||'';
                if(!src.endsWith(`/game-data/data/current/images/skills/${id}.png`))throw Error('skill icon does not match its current Classic ID: '+(im.alt||id)+' -> '+src);
                if(/\/game-media\/icons\//.test(src)||/\/game-media\/icons\//.test(im.dataset.assetFallbacks||''))throw Error('generic item/icon endpoint still used by Skill Tree');
              }

              d.querySelector('#nav .nav-btn[data-page="classicdb"]')?.click();
              await wait(400);
              const dataset=d.getElementById('db-dataset');
              dataset.value='skills';dataset.dispatchEvent(new w.Event('change',{bubbles:true}));dataset.dispatchEvent(new w.Event('input',{bubbles:true}));
              const dbSearch=d.getElementById('db-search');
              if(dbSearch){dbSearch.value='Magic Guard';dbSearch.dispatchEvent(new w.Event('input',{bubbles:true}));dbSearch.dispatchEvent(new w.Event('change',{bubbles:true}));}
              await wait(1800);
              const dbCards=[...d.querySelectorAll('#db-results .db-card')];
              const dbMagicGuard=dbCards.find(card=>String(card.querySelector('h3')?.textContent||'').trim()==='Magic Guard');
              const dbMagicGuardIcon=dbMagicGuard?.querySelector('.db-thumb img.canonical-skill-icon');
              if(!dbMagicGuardIcon||dbMagicGuardIcon.dataset.skillId!=='2001000')throw Error('Skills database Magic Guard icon is not canonical 2001000');
              if((dbMagicGuardIcon.getAttribute('src')||'')!==(magicGuardIcon.getAttribute('src')||''))throw Error('Skill Tree and Skills DB disagree on Magic Guard artwork');

              d.querySelector('#nav .nav-btn[data-page="cashshop"]')?.click();
              await wait(2600);
              const cash=d.getElementById('cash-results');
              const unavailable=[...(cash?.querySelectorAll('.cash-card.cash-unavailable')||[])];
              if(!unavailable.length)throw Error('Cash Shop unavailable styling missing');
              if(/\b0\s*NX\b/i.test(cash?.innerText||''))throw Error('Cash Shop still displays 0 NX');
              if(unavailable.some(card=>!/UNAVAILABLE/i.test(card.querySelector('.cash-meta b')?.textContent||'')))throw Error('Unavailable Cash Shop price copy missing');

              const pages=['dashboard','leveling','quests','equipment','skills','etc','classicdb','cashshop','beauty'];
              const broken=[],external=[];
              for(const page of pages){
                d.querySelector(`#nav .nav-btn[data-page="${page}"]`)?.click();
                await wait(page==='classicdb'||page==='cashshop'||page==='beauty'?1800:700);
                d.querySelectorAll('img').forEach(img=>img.loading='eager');
                w.scrollTo(0,d.body.scrollHeight);
                await wait(800);
                const root=d.querySelector(`section[data-page="${page}"]`);
                [...(root?.querySelectorAll('img')||[])].forEach(img=>{
                  const src=img.getAttribute('src')||'';
                  if(img.complete&&img.naturalWidth===0&&src)broken.push(`${page}: ${img.alt||'(no alt)'} -> ${src}`);
                  if(src&&!/^(?:data:|blob:)/i.test(src)){
                    const u=new URL(src,w.location.href);
                    if(u.origin!==w.location.origin)external.push(`${page}: ${src}`);
                  }
                });
                w.scrollTo(0,0);
              }
              if(broken.length)throw Error('broken images: '+broken.slice(0,12).join(' | '));
              if(external.length)throw Error('third-party image URLs exposed: '+external.slice(0,12).join(' | '));

              d.querySelector('#nav .nav-btn[data-page="dashboard"]')?.click();
              await wait(300);
              const visibleText=d.body.innerText||'';
              if(/\b(?:COT2|OSMS)\b|pre[- ]launch|launch[- ]scope|Evidence\s*&\s*sources/i.test(visibleText))throw Error('source/provenance language visible in public UI');
              out.textContent='visual-ui-regression-ok';
            }catch(e){out.textContent='visual-ui-regression-failed: '+e.message;}
          });
          </script></body>
          HTML

          "$chrome" --headless --no-sandbox --disable-gpu --window-size=1440,1000 --virtual-time-budget=60000 --dump-dom http://127.0.0.1:4173/ci-visual-regression.html >/tmp/visual-regression.html
          grep -o '<pre id="result">[^<]*' /tmp/visual-regression.html || true
          grep -q '<pre id="result">visual-ui-regression-ok</pre>' /tmp/visual-regression.html
