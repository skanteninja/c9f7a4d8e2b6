<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;height:900px;width:100%}#result{position:fixed;bottom:0;background:white;color:black}</style><iframe id="app" src="/?build=magician-il-fresh&page=quests&ci=quest-journal"></iframe><pre id="result">pending</pre><script>
const delay = ms => new Promise(r => setTimeout(r,ms));
document.getElementById('app').addEventListener('load', async () => {
  const result = document.getElementById('result');
  try {
    const frame = document.getElementById('app'), d = frame.contentDocument, w = frame.contentWindow;
    for(let i=0;i<80&&!d.documentElement.classList.contains('quest-planner-ready');i++) await delay(100);
    const check = (ok,msg) => {if(!ok) throw Error(msg);};
    check(d.documentElement.classList.contains('quest-planner-ready'),'Quest planner did not initialize');
    d.getElementById('session-entry-continue')?.click();
    d.querySelector('[data-session-gender="male"]')?.click();
    d.querySelector('#nav [data-page="quests"]').click();
    check(w.getComputedStyle(d.querySelector('.quest-journal-card')).backgroundImage!=='none','Quest card stylesheet not applied');
    check(w.getComputedStyle(d.querySelector('.quest-journal-card summary')).display==='flex','Quest disclosure layout missing');
    check(parseFloat(w.getComputedStyle(d.querySelector('.quest-journal-card .quest-name')).fontSize)>=17,'Quest name is too small');
    const input = (id,value) => {const el=d.getElementById(id);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));};
    const selectQuest = id => {d.getElementById('quest-clear').click();input('quest-search',`#${id}`);};
    selectQuest('1001');
    check(d.querySelectorAll('.quest-journal-card').length===1,'Exact quest ID search is ambiguous');
    check(d.querySelector('.quest-state').textContent==='Prerequisites needed','Dependent quest incorrectly ready');
    d.querySelector('.quest-journal-card summary').click();
    await delay(60);
    check(d.querySelector('#quest-list details').open,'Quest details did not open');
    check(w.getComputedStyle(d.querySelector('.quest-detail-grid')).display==='grid','Quest detail grid stylesheet missing');
    check(d.querySelector('.quest-detail-grid').textContent.includes('Given on start'),'Given-on-start objective missing');
    check(!d.querySelector('.quest-save'),'NPC-given mirror incorrectly listed as gatherable');
    d.querySelector('[data-quest-jump="1000"]').click();
    check(d.querySelector('[data-quest-id="1000"]'),'Prerequisite navigation failed');
    const c = d.querySelector('.quest-check');c.checked=true;c.dispatchEvent(new w.Event('change',{bubbles:true}));
    selectQuest('1001');check(d.querySelector('.quest-state').textContent==='Ready to start','Completing prerequisite did not unlock child');
    selectQuest('1000');const undo=d.querySelector('.quest-check');undo.checked=false;undo.dispatchEvent(new w.Event('change',{bubbles:true}));
    selectQuest('1001');check(d.querySelector('.quest-state').textContent==='Prerequisites needed','Unchecking prerequisite did not relock child');
    selectQuest('10401');d.querySelector('#quest-list summary').click();await delay(60);
    check(d.querySelector('.quest-detail-grid').textContent.includes('Wand Magic Attack Scroll'),'Magician reward choice missing');
    check(!d.querySelector('.quest-detail-grid').textContent.includes('Claw Attack Scroll'),'Wrong-class choice reward leaked');
    selectQuest('10200');check(d.querySelector('.quest-cadence').textContent==='Repeatable','Repeatable metadata missing');
    const level = n => {const el=d.getElementById('level-select');el.value=String(n);el.dispatchEvent(new w.Event('change',{bubbles:true}));};
    level(70);await delay(100);
    selectQuest('506018');check(d.querySelector('.quest-state').textContent==='Prerequisites needed','Missing source prerequisite ignored');
    selectQuest('10010');d.querySelector('#quest-list summary').click();await delay(80);
    check(d.querySelector('.quest-detail-grid').textContent.includes('Defeat Slime x 10'),'Kill objective missing');
    check(d.querySelector('.quest-detail-grid').textContent.includes('234'),'Meso reward missing');
    selectQuest('506001');d.querySelector('#quest-list summary').click();await delay(80);
    check(d.querySelector('.quest-detail-grid').textContent.includes('Henesys Citizenship Grade 1+'),'Current citizenship grade missing');
    input('quest-town','2');check(!d.querySelector('[data-quest-id="506001"]'),'Wrong-town quest still shown');
    d.getElementById('quest-clear').click();
    d.querySelector('#nav [data-page="etc"]').click();
    input('etc-search','Orange Mushroom Cap');
    const cap=()=>d.querySelector('#etc-list [data-item-id="4000009"]');
    check(cap()&&cap().dataset.etcTarget==='48','Quest material baseline incorrect');
    d.querySelector('.etc-craft-plans summary').click();
    const craft=d.querySelector('[data-craft-plan="194"]');
    check(craft,'Hardwood Wand craft missing');craft.checked=true;craft.dispatchEvent(new w.Event('change',{bubbles:true}));
    await delay(100);check(cap().dataset.etcTarget==='82','Selected recipe reserve not added once');
    check(!cap().querySelector('[data-held]').hidden,'Legacy decorator hides current stock input');
    check(cap().querySelector('.etc-recommended b').textContent==='82','Legacy decorator overwrites target');
    const stock=cap().querySelector('[data-held]');stock.value='12';stock.dispatchEvent(new w.Event('change',{bubbles:true}));
    check(cap().querySelector('.etc-stock-controls>span b').textContent==='70','Held stock not subtracted');
    craft.checked=false;craft.dispatchEvent(new w.Event('change',{bubbles:true}));
    check(cap().dataset.etcTarget==='48','Unselected craft still reserved');
    input('etc-kind','quest');input('etc-search','Dark Marble');
    check(d.querySelector('[data-item-id="4031019"]').dataset.etcTarget==='30','Advancement item is not exact');
    check(d.querySelectorAll('#etc-list [data-item-id]').length===1,'Other-class advancement item leaked');
    input('etc-kind','bank');input('etc-search','');
    for(const width of [1365,1024,390]) {
      frame.style.width=width+'px';await delay(100);
      check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+2,`ETC page overflows at ${width}`);
      for(const el of d.querySelectorAll('.etc-planner-card'))check(el.scrollWidth<=el.clientWidth+2,`ETC card overflows at ${width}`);
    }
    frame.style.width='1365px';d.querySelector('#nav [data-page="dashboard"]').click();
    level(69);await delay(100);check(d.querySelector('#job-plan [value="third"]').disabled,'Third job available below Lv70');
    level(70);await delay(100);check(!d.querySelector('#job-plan [value="third"]').disabled,'Third job preview remains locked');
    input('job-plan','third');d.getElementById('job-plan').dispatchEvent(new w.Event('change',{bubbles:true}));await delay(100);
    check(d.getElementById('v5-job-title').textContent.includes('I/L Mage'),'Third-job dashboard preview missing');
    level(100);await delay(100);
    check(d.getElementById('hero-level').textContent==='100','Level 100 clamped');
    check(d.querySelector('.tcw-ap-allocation').textContent.includes('Allocation not yet researched'),'Unverified Lv100 AP presented as researched');
    check(d.querySelectorAll('.future-skill-grid>div').length===7,'Third-job reference missing');
    level(69);await delay(100);check(!d.getElementById('v5-job-title').textContent.includes('Mage'),'Preview persists below its level gate');
    level(100);await delay(100);check(d.getElementById('v5-job-title').textContent.includes('I/L Mage'),'Saved third-job preview lost');
    d.querySelector('#nav [data-page="quests"]').click();selectQuest('10010');d.querySelector('#quest-list summary').click();await delay(80);
    for(const width of [1365,1024,390]) {
      frame.style.width=width+'px';await delay(100);
      check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+2,`Page overflows at ${width}`);
      for(const el of d.querySelectorAll('[data-page="quests"] .quest-journal-card,[data-page="quests"] .quest-detail-grid')) check(el.scrollWidth<=el.clientWidth+2,`Quest content overflows at ${width}`);
    }
    level(1);await delay(100);
    d.getElementById('quest-clear').click();input('quest-status','upcoming');
    check(d.querySelectorAll('.quest-journal-card').length>0,'Upcoming filter has no quests at level 1');
    input('quest-search','no-such-quest-xyz');check(d.querySelector('.quest-empty'),'Empty result state missing');
    result.textContent='quest-browser-regression-ok';
  } catch(e) {result.textContent='quest-browser-regression-failed: '+e.message;}
});
</script>
