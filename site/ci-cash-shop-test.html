<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;height:1000px;width:1365px}#result{position:fixed;bottom:0;background:white;color:black}</style><iframe id="app" src="/?build=magician-il-fresh&page=cashshop"></iframe><pre id="result">pending</pre><script>
(async()=>{
  const frame=document.getElementById('app'),result=document.getElementById('result'),delay=ms=>new Promise(r=>setTimeout(r,ms));
  const check=(ok,msg)=>{if(!ok)throw Error(msg)};
  try{
    await new Promise(resolve=>frame.onload=resolve);
    const d=frame.contentDocument,w=frame.contentWindow;
    for(let i=0;i<120&&d.querySelectorAll('#cash-results .cash-card').length!==69;i++)await delay(100);
    d.getElementById('session-entry-continue')?.click();d.querySelector('[data-session-gender="male"]')?.click();
    const cards=()=>[...d.querySelectorAll('#cash-results .cash-card')];
    const select=async(id,value)=>{const el=d.getElementById(id);el.value=value;el.dispatchEvent(new w.Event('change',{bubbles:true}));await delay(200)};
    const search=async value=>{const el=d.getElementById('cash-search');el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));await delay(200)};
    const find=name=>cards().find(card=>card.querySelector('h3').textContent===name);
    const tags=()=>[...d.querySelectorAll('#cash-results .cash-duration')];
    check(cards().length===69,'Release catalog count/default incorrect');
    check(cards().every(c=>c.dataset.cashCatalog==='founders-access'),'Beta items leaked into release');
    check(tags().every(t=>t.parentElement.classList.contains('cash-price-row')),'Duration tags are not beside prices');
    const permanent=tags().find(t=>t.dataset.duration==='permanent'),timed=tags().find(t=>t.dataset.duration==='timed');
    check(permanent.textContent==='PERMANENT','Permanent tag case incorrect');
    check(w.getComputedStyle(permanent).color==='rgb(255, 100, 109)','Permanent tag is not red');
    check(w.getComputedStyle(timed).color==='rgb(195, 195, 200)','Time-limited tag is not grey');
    check(find('Convenience Essentials Pack').querySelector('.cash-price-row b').textContent==='9,900 NX','Discount price wrong');
    check(find('Convenience Essentials Pack').textContent.includes('Safety Charm (10) (90-day duration)'),'Timed bundle contents missing');
    check(find('Aurora Mystery Fashion Crate').querySelector('.cash-price-row b').textContent==='20 Aurora Stamps','Stamp price became NX');
    check(find("Founder's Mystery Fashion Crate").querySelectorAll('.cash-reward-list li').length===50,'Founder reward rates missing');
    await select('cash-duration-filter','permanent');check(cards().length===27,'Permanent filter incorrect');
    await select('cash-duration-filter','all');await search('Essentials');check(cards().length===3,'Release search incorrect');
    for(const width of [390,1024,1365]){
      frame.style.width=width+'px';await delay(200);
      check(d.documentElement.scrollWidth<=width+2,`Page overflow ${width}`);
      for(const card of cards()){
        const bounds=card.getBoundingClientRect();
        for(const el of card.querySelectorAll('.cash-price-row b,.cash-duration,summary')){const r=el.getBoundingClientRect();check(r.left>=bounds.left-1&&r.right<=bounds.right+1,`Price/tag overflow ${width}`)}
      }
    }
    frame.style.width='1365px';await search('');await select('cash-catalog','beta');
    check(d.getElementById('cash-status').textContent.includes('872'),'Full beta database missing');
    check(cards().length===96,'Beta pagination wrong');
    check(find('Mystery Hair Coupon').querySelector('.cash-price-row b').textContent==='100 NX','Beta price overwritten');
    check(find('Mystery Hair Coupon').querySelector('.cash-duration').textContent==='PERMANENT','Beta duration overwritten');
    check(cards().filter(c=>c.classList.contains('cash-unavailable')).every(c=>c.querySelector('.cash-price-row b').textContent==='UNAVAILABLE'),'Beta zero prices treated as free');
    const more=d.getElementById('cash-load-more');more.click();await delay(200);check(cards().length===192,'Beta load more failed');
    await select('cash-category','Pet');await search('Brown Puppy');check(cards().length===1&&find('Brown Puppy').textContent.includes('3 days pet life'),'Beta pet life wrong');
    await search('');await select('cash-category','all');
    const sale=d.getElementById('cash-sale-only');sale.checked=true;sale.dispatchEvent(new w.Event('change',{bubbles:true}));await delay(200);
    check(d.getElementById('cash-status').textContent.includes('130'),'Beta availability filter incorrect');
    sale.checked=false;sale.dispatchEvent(new w.Event('change',{bubbles:true}));await delay(200);
    await w.TCW_CASH_SHOP.restore({'cash-catalog':'founders-access','cash-category':'Pets','cash-search':'Brown Puppy','cash-duration-filter':'timed'});
    check(cards().length===1&&find('Brown Puppy').textContent.includes('30 days'),'Catalog/category history restore failed');
    result.textContent='cash-shop-browser-regression-ok';
  }catch(error){result.textContent='cash-shop-browser-regression-failed: '+error.message}
})();
</script>
